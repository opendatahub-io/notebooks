---
# RHOAI additional overlay: ODH baseline ImageStreams (jupyter, code-server, runtime).
#
# Baseline images ship in manifests/odh/base/ but are excluded from rhoai/base/.
# ImageStream YAMLs are reused from the ODH tree; quay.io refs come from ODH
# params-latest.env because baseline images publish under quay.io/opendatahub.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../odh/base/jupyter-baseline-notebook-imagestream.yaml
  - ../../../../odh/base/code-server-baseline-notebook-imagestream.yaml
  - ../../../../odh/base/runtime-baseline-imagestream.yaml

configMapGenerator:
  - envs:
      - ../../../../odh/base/params-latest.env
    name: notebook-baseline-image-params
  - envs:
      - ../../../../odh/base/commit-latest.env
    name: notebook-baseline-image-commithash
generatorOptions:
  disableNameSuffixHash: true

labels:
  - includeSelectors: true
    pairs:
      component.opendatahub.io/name: notebooks
      opendatahub.io/component: "true"
replacements:
  - source:
      fieldPath: data.odh-workbench-jupyter-baseline-cpu-py312-c9s-n
      kind: ConfigMap
      name: notebook-baseline-image-params
      version: v1
    targets:
      - fieldPaths:
          - spec.tags.0.from.name
        select:
          group: image.openshift.io
          kind: ImageStream
          name: jupyter-baseline-notebook
          version: v1
  - source:
      fieldPath: data.odh-workbench-codeserver-baseline-cpu-py312-c9s-n
      kind: ConfigMap
      name: notebook-baseline-image-params
      version: v1
    targets:
      - fieldPaths:
          - spec.tags.0.from.name
        select:
          group: image.openshift.io
          kind: ImageStream
          name: code-server-baseline-notebook
          version: v1
  - source:
      fieldPath: data.odh-pipeline-runtime-baseline-cpu-py312-c9s-n
      kind: ConfigMap
      name: notebook-baseline-image-params
      version: v1
    targets:
      - fieldPaths:
          - spec.tags.0.from.name
        select:
          group: image.openshift.io
          kind: ImageStream
          name: runtime-baseline
          version: v1
  - source:
      fieldPath: data.odh-workbench-jupyter-baseline-cpu-py312-c9s-commit-n
      kind: ConfigMap
      name: notebook-baseline-image-commithash
      version: v1
    targets:
      - fieldPaths:
          - spec.tags.0.annotations.[opendatahub.io/notebook-build-commit]
        select:
          group: image.openshift.io
          kind: ImageStream
          name: jupyter-baseline-notebook
          version: v1
  - source:
      fieldPath: data.odh-workbench-codeserver-baseline-cpu-py312-c9s-commit-n
      kind: ConfigMap
      name: notebook-baseline-image-commithash
      version: v1
    targets:
      - fieldPaths:
          - spec.tags.0.annotations.[opendatahub.io/notebook-build-commit]
        select:
          group: image.openshift.io
          kind: ImageStream
          name: code-server-baseline-notebook
          version: v1
