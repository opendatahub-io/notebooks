---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  labels:
    opendatahub.io/runtime-image: "true"
  annotations:
    opendatahub.io/runtime-image-url: "https://github.com/opendatahub-io/notebooks/tree/main/jupyter/universal/ubi9-python-3.12"
    opendatahub.io/runtime-image-name: "Runtime | CPU | Python 3.12 | Latest"
    opendatahub.io/runtime-image-desc: "Universal image as Elyra/AI Pipelines runtime (same digest as the JupyterLab Universal workbench)."
    opendatahub.io/notebook-tier: "Red Hat-provided"
  name: runtime-universal
spec:
  lookupPolicy:
    local: true
  tags:
    - annotations:
        # language=json
        opendatahub.io/runtime-image-metadata: |
          [
            {
              "display_name": "Runtime | CPU | Python 3.12 | Latest",
              "metadata": {
                "tags": [
                  "universal"
                ],
                "display_name": "Runtime | CPU | Python 3.12 | Latest",
                "pull_policy": "IfNotPresent"
              },
              "schema_name": "runtime-image"
            }
          ]
        # Same digest as jupyter-universal-notebook (dual-mode entrypoint).
        openshift.io/imported-from: quay.io/opendatahub/odh-workbench-jupyter-universal-cpu-py312-c9s
      from:
        kind: DockerImage
        name: odh-workbench-jupyter-universal-cpu-py312-c9s-n_PLACEHOLDER
      name: "universal"
      referencePolicy:
        type: Source
