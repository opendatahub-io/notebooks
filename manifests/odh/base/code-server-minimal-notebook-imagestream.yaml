---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  labels:
    opendatahub.io/notebook-image: "true"
  annotations:
    opendatahub.io/notebook-image-url: "https://github.com/opendatahub-io/notebooks/tree/main/codeserver-minimal"
    opendatahub.io/notebook-image-name: "Code Server | CPU | Python 3.12"
    opendatahub.io/notebook-image-desc: "Minimal code-server workbench with Python 3.12."
    opendatahub.io/notebook-image-order: "25"
    opendatahub.io/notebook-tier: "secure"
  name: code-server-minimal-notebook
spec:
  lookupPolicy:
    local: true
  tags:
    # N Version of the image
    - annotations:
        # language=json
        opendatahub.io/notebook-software: |
          [
            {"name": "code-server", "version": "4.122"},
            {"name": "Python", "version": "v3.12"}
          ]
        # language=json
        opendatahub.io/notebook-python-dependencies: |
          [
            {"name": "JupyterLab", "version": "4.5"}
          ]
        openshift.io/imported-from: quay.io/opendatahub/odh-workbench-codeserver-minimal-cpu-py312
        opendatahub.io/workbench-image-recommended: "true"
        opendatahub.io/notebook-build-commit: odh-workbench-codeserver-minimal-cpu-py312-commit-n_PLACEHOLDER
      from:
        kind: DockerImage
        name: odh-workbench-codeserver-minimal-cpu-py312-n_PLACEHOLDER
      name: "3.6"
      referencePolicy:
        type: Source
