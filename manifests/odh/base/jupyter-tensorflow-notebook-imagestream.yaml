            {"name": "Pandas", "version": "2.3"},
            {"name": "Scikit-learn", "version": "1.9"},
            {"name": "Scipy", "version": "1.18"},
            {"name": "Odh-Elyra", "version": "5.0"},
            {"name": "PyMongo", "version": "4.17"},
            {"name": "Pyodbc", "version": "5.3"},
            {"name": "Codeflare-SDK", "version": "0.38"},
            {"name": "Feast", "version": "0.66"},
            {"name": "Sklearn-onnx", "version": "1.20"},
            {"name": "Psycopg", "version": "3.3"},
            {"name": "MySQL Connector/Python", "version": "26.7"},
            {"name": "MLflow", "version": "3.15"}
          ]
        openshift.io/imported-from: quay.io/opendatahub/odh-workbench-jupyter-tensorflow-cuda-py312-ubi9
        opendatahub.io/workbench-image-recommended: 'true'
        opendatahub.io/notebook-build-commit: odh-workbench-jupyter-tensorflow-cuda-py312-ubi9-commit-n_PLACEHOLDER
      from:
        kind: DockerImage
        name: odh-workbench-jupyter-tensorflow-cuda-py312-ubi9-n_PLACEHOLDER
      name: "3.6"
