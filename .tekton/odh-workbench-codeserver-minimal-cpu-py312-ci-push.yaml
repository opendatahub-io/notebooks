apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/opendatahub-io/notebooks?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: 'false'
    pipelinesascode.tekton.dev/max-keep-runs: '3'
    build.appstudio.openshift.io/build-nudge-files: manifests/base/params-latest.env
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push" && target_branch == "main" &&
      !("manifests/base/params-latest.env".pathChanged()) &&
      (
        ".tekton/odh-workbench-codeserver-minimal-cpu-py312-ci-push.yaml".pathChanged() ||
        "codeserver-minimal/ubi9-python-3.12/**".pathChanged() ||
        "codeserver-minimal/ubi9-python-3.12/Dockerfile.konflux.cpu".pathChanged() ||
        "codeserver-minimal/ubi9-python-3.12/build-args/cpu.conf".pathChanged()
      )
  labels:
    appstudio.openshift.io/application: opendatahub-builds
    appstudio.openshift.io/component: odh-workbench-codeserver-minimal-cpu-py312-ci
    pipelines.appstudio.openshift.io/type: build
  name: odh-workbench-codeserver-minimal-cpu-py312-ci-on-push
  namespace: open-data-hub-tenant
spec:
  timeouts:
    pipeline: 6h
  params:
  - name: event-type
    value: '{{event_type}}'
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/opendatahub/odh-workbench-codeserver-minimal-cpu-py312:odh-stable
  - name: build-platforms
    value:
    - linux/x86_64
    - linux/arm64
  - name: dockerfile
    value: Dockerfile.konflux.cpu
  - name: path-context
    value: codeserver-minimal/ubi9-python-3.12
  - name: build-args-file
    value: codeserver-minimal/ubi9-python-3.12/build-args/cpu.conf
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/opendatahub-io/odh-konflux-central.git
    - name: revision
      value: main
    - name: pathInRepo
      value: pipeline/multi-arch-container-build.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-workbench-codeserver-minimal-cpu-py312-ci
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
