            dnf install -y podman podman-docker git python3 curl make
            grep -E 'CapEff|NoNewPrivs' /proc/self/status
            export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
            cd /workspace
            export DOCKER_HOST="unix:///run/podman/podman.sock"
            export TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE="/run/podman/podman.sock"
            mkdir -p "$HOME/bin"
            curl -Lo "$HOME/bin/kind" https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
            chmod +x "$HOME/bin/kind"
            curl -Lo "$HOME/bin/kubectl" https://dl.k8s.io/release/v1.34.1/bin/linux/amd64/kubectl
            chmod +x "$HOME/bin/kubectl"
            export KIND_EXPERIMENTAL_PROVIDER=podman
            curl -LsSf https://astral.sh/uv/0.12.13/install.sh | sh
            uv python install 3.14
            git clone "$(params.GIT_URL)" src_code
            cd src_code
