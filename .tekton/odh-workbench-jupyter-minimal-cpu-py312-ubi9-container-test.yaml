---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/opendatahub-io/notebooks?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: 'true'
    pipelinesascode.tekton.dev/max-keep-runs: '3'
    pipelinesascode.tekton.dev/on-comment: ^/(test-jupyter-minimal-container|retest-jupyter-minimal-container)$
  labels:
    appstudio.openshift.io/application: opendatahub-release
    appstudio.openshift.io/component: odh-workbench-jupyter-minimal-cpu-py312-ubi9
    kueue.x-k8s.io/priority-class: konflux-pre-merge-test
    pipelines.appstudio.openshift.io/type: test
  name: odh-workbench-jupyter-minimal-cpu-py312-ubi9-container-test
  namespace: open-data-hub-tenant
spec:
  timeouts:
    pipeline: 6h
    tasks: 6h
  params:
  - name: image
    value: quay.io/opendatahub/odh-workbench-jupyter-minimal-cpu-py312-ubi9:on-pr-{{revision}}
  pipelineSpec:
    params:
    - name: image
      type: string
    tasks:
    - name: wait-for-image
      params:
      - name: image
        value: $(params.image)
      taskSpec:
        params:
        - name: image
          type: string
        results:
        - name: IMAGE
          description: Immutable image reference
        steps:
        - name: resolve
          image: quay.io/konflux-ci/konflux-test:stable
          env:
          - name: IMAGE
            value: $(params.image)
          script: |
            #!/bin/bash
            set -Eeuo pipefail
            deadline=$((SECONDS + 300))
            while (( SECONDS < deadline )); do
              if digest="$(skopeo inspect --format '{{.Digest}}' "docker://${IMAGE}" 2>/dev/null)"; then
                repository="${IMAGE%%:*}"
                printf '%s@%s' "${repository}" "${digest}" > "$(results.IMAGE.path)"
                cat "$(results.IMAGE.path)"
                exit 0
              fi
              echo "Waiting briefly for ${IMAGE} to become visible in the registry"
              sleep 10
            done
            echo "Timed out waiting for ${IMAGE}" >&2
            exit 1
    - name: verify-multiarch-index
      runAfter:
      - wait-for-image
      params:
      - name: image
        value: $(tasks.wait-for-image.results.IMAGE)
      taskSpec:
        params:
        - name: image
          type: string
        steps:
        - name: verify-platforms
          image: quay.io/konflux-ci/konflux-test:stable
          env:
          - name: IMAGE
            value: $(params.image)
          script: |
            #!/bin/bash
            set -Eeuo pipefail
            skopeo inspect --raw "docker://${IMAGE}" > /tmp/index.json
            for platform in amd64 arm64 ppc64le s390x; do
              jq -e --arg platform "${platform}" \
                '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $platform)' \
                /tmp/index.json >/dev/null
              echo "Found linux/${platform} manifest"
            done
    - name: integration-test
      runAfter:
      - wait-for-image
      params:
      - name: image
        value: $(tasks.wait-for-image.results.IMAGE)
      taskSpec:
        params:
        - name: image
          type: string
        steps:
        - name: verify-jupyter-minimal-runtime
          image: $(params.image)
          script: |
            #!/bin/bash
            set -Eeuo pipefail
            export NOTEBOOK_BASE_URL=/notebook/konflux-test/
            export NOTEBOOK_ARGS="--ServerApp.port=8888
            --ServerApp.token=''
            --ServerApp.password=''
            --ServerApp.quit_button=False"
            server_pid=0
            stop_server() {
              set +e
              if (( server_pid )); then
                kill "${server_pid}" 2>/dev/null
                wait "${server_pid}" 2>/dev/null
              fi
            }
            trap stop_server EXIT
            start-notebook.sh &
            server_pid=$!

            response_file=/tmp/jupyter-response.html
            deadline=$((SECONDS + 180))
            while (( SECONDS < deadline )); do
              if curl --fail --silent --show-error --max-time 10 \
                http://127.0.0.1:8888/notebook/konflux-test/api \
                >"${response_file}"; then
                break
              fi
              sleep 2
            done
            if (( SECONDS >= deadline )); then
              echo "JupyterLab did not become ready" >&2
              exit 1
            fi

            curl --fail --silent --show-error --max-time 30 \
              --location http://127.0.0.1:8888/notebook/konflux-test/ >"${response_file}"
            grep -Eq 'class="pf-v6-c-spinner"|jp-ThemedContainer' "${response_file}"

            extension_output="$(jupyter labextension list 2>&1)"
            printf '%s\n' "${extension_output}"
            grep -E 'odh-jupyter-trash-cleanup.*enabled.*OK' <<<"${extension_output}"
            grep -A20 'Disabled extensions:' <<<"${extension_output}" |
              grep -q '@jupyterlab/apputils-extension:announcements'

            cat >test.ipynb <<'JSON'
            {
              "cells": [
                {
                  "cell_type": "code",
                  "execution_count": null,
                  "metadata": {},
                  "outputs": [],
                  "source": ["print('Hello World')"]
                }
              ],
              "metadata": {},
              "nbformat": 4,
              "nbformat_minor": 5
            }
            JSON
            jupyter nbconvert test.ipynb --to pdf
            test -f test.pdf
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-workbench-jupyter-minimal-cpu-py312-ubi9
