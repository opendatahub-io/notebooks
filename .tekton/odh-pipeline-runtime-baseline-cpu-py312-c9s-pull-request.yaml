apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/opendatahub-io/notebooks?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-comment: ^/(kfbuild\-all|build\-konflux|build\-runtime\-baseline)
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "pull_request" && target_branch == "main" &&
      !("manifests/base/params-latest.env".pathChanged()) &&
      (
        ".tekton/odh-pipeline-runtime-baseline-cpu-py312-c9s-pull-request.yaml".pathChanged() ||
        "runtimes/baseline/ubi9-python-3.12/**".pathChanged() ||
        "runtimes/baseline/ubi9-python-3.12/build-args/cpu.conf".pathChanged() ||
        "prefetch-input/odh/**".pathChanged()
      ) && body.repository.full_name == "opendatahub-io/notebooks"
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: opendatahub-builds
    appstudio.openshift.io/component: odh-pipeline-runtime-baseline-cpu-py312-c9s-ci
    pipelines.appstudio.openshift.io/type: build
  name: odh-pipeline-runtime-baseline-cpu-py312-c9s-on-pull-request
  namespace: open-data-hub-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/opendatahub/odh-pipeline-runtime-baseline-cpu-py312-c9s:odh-pr
  - name: dockerfile
    value: runtimes/baseline/ubi9-python-3.12/Dockerfile.konflux.cpu
  - name: path-context
    value: .
  - name: build-args-file
    value: runtimes/baseline/ubi9-python-3.12/build-args/cpu.conf
  - name: build-platforms
    value:
    - linux/x86_64
    - linux-m2xlarge/arm64
    - linux/ppc64le
    - linux/s390x
  - name: hermetic
    value: true
  - name: prefetch-input
    value:
    - path: prefetch-input/odh
      type: rpm
    - path: prefetch-input/odh
      type: generic
    - path: runtimes/baseline/ubi9-python-3.12
      type: pip
      binary:
        arch: "x86_64,aarch64,ppc64le,s390x"
      requirements_files: [requirements.cpu.txt]
  - name: additional-tags
    value:
    - 3.6_ea2-v1.49
    - 'odh-pr-{{revision}}'
  - name: pipeline-type
    value: pull-request
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/opendatahub-io/odh-konflux-central.git
    - name: revision
      value: main
    - name: pathInRepo
      value: pipeline/multi-arch-container-build.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-pipeline-runtime-baseline-cpu-py312-c9s-ci
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
