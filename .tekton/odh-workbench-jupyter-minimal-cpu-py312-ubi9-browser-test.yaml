---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/opendatahub-io/notebooks?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: 'false'
    pipelinesascode.tekton.dev/max-keep-runs: '3'
    pipelinesascode.tekton.dev/on-comment: ^/(test-jupyter-minimal-browser|retest-jupyter-minimal-browser)
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "pull_request" && target_branch == "main" &&
      (
        ".tekton/odh-workbench-jupyter-minimal-cpu-py312-ubi9-browser-test.yaml".pathChanged() ||
        "ci/konflux/test_jupyter_minimal.sh".pathChanged() ||
        "jupyter/utils/**".pathChanged() ||
        "jupyter/minimal/ubi9-python-3.12/**".pathChanged() ||
        "jupyter/minimal/ubi9-python-3.12/build-args/cpu.conf".pathChanged() ||
        "tests/browser/**".pathChanged()
      )
  labels:
    appstudio.openshift.io/application: group-testing
    appstudio.openshift.io/component: notebooks-group
    pipelines.appstudio.openshift.io/type: test
  name: odh-workbench-jupyter-minimal-cpu-py312-ubi9-browser-test
  namespace: open-data-hub-tenant
spec:
  timeouts:
    pipeline: 3h
  params:
  - name: image
    value: quay.io/opendatahub/odh-workbench-jupyter-minimal-cpu-py312-ubi9:on-pr-{{revision}}
  - name: repo-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  pipelineSpec:
    params:
    - name: image
      type: string
    - name: repo-url
      type: string
    - name: revision
      type: string
    tasks:
    - name: wait-for-image
      params:
      - name: image
        value: $(params.image)
      taskSpec:
        params:
        - name: image
          type: string
        results:
        - name: IMAGE
          description: Immutable image reference
        steps:
        - name: resolve
          image: quay.io/konflux-ci/konflux-test:stable
          env:
          - name: IMAGE
            value: $(params.image)
          script: |
            #!/bin/bash
            set -Eeuo pipefail
            deadline=$((SECONDS + 5400))
            while (( SECONDS < deadline )); do
              if digest="$(skopeo inspect --format '{{.Digest}}' "docker://${IMAGE}" 2>/dev/null)"; then
                repository="${IMAGE%%:*}"
                printf '%s@%s' "${repository}" "${digest}" > "$(results.IMAGE.path)"
                cat "$(results.IMAGE.path)"
                exit 0
              fi
              echo "Waiting for ${IMAGE} to be published"
              sleep 30
            done
            echo "Timed out waiting for ${IMAGE}" >&2
            exit 1
    - name: provision-eaas-space
      taskRef:
        resolver: git
        params:
        - name: url
          value: https://github.com/konflux-ci/build-definitions.git
        - name: revision
          value: main
        - name: pathInRepo
          value: task/eaas-provision-space/0.1/eaas-provision-space.yaml
      params:
      - name: ownerName
        value: $(context.pipelineRun.name)
      - name: ownerUid
        value: $(context.pipelineRun.uid)
    - name: provision-cluster
      runAfter:
      - provision-eaas-space
      taskSpec:
        results:
        - name: clusterName
          value: "$(steps.create-cluster.results.clusterName)"
        steps:
        - name: pick-version
          ref:
            resolver: git
            params:
            - name: url
              value: https://github.com/konflux-ci/build-definitions.git
            - name: revision
              value: main
            - name: pathInRepo
              value: stepactions/eaas-get-latest-openshift-version-by-prefix/0.1/eaas-get-latest-openshift-version-by-prefix.yaml
          params:
          - name: prefix
            value: 4.20.
        - name: create-cluster
          ref:
            resolver: git
            params:
            - name: url
              value: https://github.com/konflux-ci/build-definitions.git
            - name: revision
              value: main
            - name: pathInRepo
              value: stepactions/eaas-create-ephemeral-cluster-hypershift-aws/0.1/eaas-create-ephemeral-cluster-hypershift-aws.yaml
          params:
          - name: eaasSpaceSecretRef
            value: $(tasks.provision-eaas-space.results.secretRef)
          - name: version
            value: "$(steps.pick-version.results.version)"
          - name: instanceType
            value: m5.2xlarge
    - name: browser-test
      runAfter:
      - wait-for-image
      - provision-cluster
      params:
      - name: IMAGE
        value: $(params.image)
      - name: REPO_URL
        value: $(params.repo-url)
      - name: REVISION
        value: $(params.revision)
      taskSpec:
        params:
        - name: IMAGE
          type: string
        - name: REPO_URL
          type: string
        - name: REVISION
          type: string
        volumes:
        - name: credentials
          emptyDir: {}
        steps:
        - name: get-kubeconfig
          ref:
            resolver: git
            params:
            - name: url
              value: https://github.com/konflux-ci/build-definitions.git
            - name: revision
              value: main
            - name: pathInRepo
              value: stepactions/eaas-get-ephemeral-cluster-credentials/0.1/eaas-get-ephemeral-cluster-credentials.yaml
          params:
          - name: eaasSpaceSecretRef
            value: $(tasks.provision-eaas-space.results.secretRef)
          - name: clusterName
            value: "$(tasks.provision-cluster.results.clusterName)"
          - name: credentials
            value: credentials
        - name: run-browser-test
          image: quay.io/rhoai/rhoai-task-toolset:notebooks
          workingDir: /workspace
          env:
          - name: KUBECONFIG
            value: "/credentials/$(steps.get-kubeconfig.results.kubeconfig)"
          volumeMounts:
          - name: credentials
            mountPath: /credentials
          script: |
            #!/bin/bash
            set -Eeuo pipefail
            git init /workspace/source
            git -C /workspace/source remote add origin "$(params.REPO_URL)"
            git -C /workspace/source fetch --depth=1 origin "$(params.REVISION)"
            git -C /workspace/source checkout FETCH_HEAD
            /workspace/source/ci/konflux/test_jupyter_minimal.sh \
              browser \
              "$(params.IMAGE)" \
              "$(params.REPO_URL)" \
              "$(params.REVISION)" \
              /workspace
  taskRunTemplate:
    podTemplate:
      nodeSelector:
        konflux-ci.dev/workload: konflux-tenants
      tolerations:
      - effect: NoSchedule
        key: konflux-ci.dev/workload
        operator: Equal
        value: konflux-tenants
    serviceAccountName: konflux-integration-runner
