---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/opendatahub-io/notebooks?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: 'false'
    pipelinesascode.tekton.dev/max-keep-runs: '3'
    pipelinesascode.tekton.dev/on-comment: ^/(test-jupyter-minimal-browser|retest-jupyter-minimal-browser)
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "pull_request" && target_branch == "main" &&
      (
        ".tekton/odh-workbench-jupyter-minimal-cpu-py312-ubi9-browser-test.yaml".pathChanged() ||
        "jupyter/utils/**".pathChanged() ||
        "jupyter/minimal/ubi9-python-3.12/**".pathChanged() ||
        "jupyter/minimal/ubi9-python-3.12/build-args/cpu.conf".pathChanged() ||
        "tests/browser/**".pathChanged()
      )
  labels:
    appstudio.openshift.io/application: opendatahub-release
    appstudio.openshift.io/component: odh-workbench-jupyter-minimal-cpu-py312-ubi9
    pipelines.appstudio.openshift.io/type: test
  name: odh-workbench-jupyter-minimal-cpu-py312-ubi9-browser-test
  namespace: open-data-hub-tenant
spec:
  timeouts:
    pipeline: 2h
  params:
  - name: image
    value: quay.io/opendatahub/odh-workbench-jupyter-minimal-cpu-py312-ubi9:on-pr-{{revision}}
  - name: repo-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  pipelineSpec:
    params:
    - name: image
      type: string
    - name: repo-url
      type: string
    - name: revision
      type: string
    tasks:
    - name: wait-for-image
      params:
      - name: image
        value: $(params.image)
      taskSpec:
        params:
        - name: image
          type: string
        results:
        - name: IMAGE
          description: Immutable image reference
        steps:
        - name: resolve
          image: quay.io/konflux-ci/konflux-test:stable
          env:
          - name: IMAGE
            value: $(params.image)
          script: |
            #!/bin/bash
            set -Eeuo pipefail
            deadline=$((SECONDS + 5400))
            while (( SECONDS < deadline )); do
              if digest="$(skopeo inspect --format '{{.Digest}}' "docker://${IMAGE}" 2>/dev/null)"; then
                repository="${IMAGE%%:*}"
                printf '%s@%s' "${repository}" "${digest}" > "$(results.IMAGE.path)"
                cat "$(results.IMAGE.path)"
                exit 0
              fi
              echo "Waiting for ${IMAGE} to be published"
              sleep 30
            done
            echo "Timed out waiting for ${IMAGE}" >&2
            exit 1
    - name: browser-test
      runAfter:
      - wait-for-image
      params:
      - name: IMAGE
        value: $(tasks.wait-for-image.results.IMAGE)
      - name: REPO_URL
        value: $(params.repo-url)
      - name: REVISION
        value: $(params.revision)
      taskSpec:
        params:
        - name: IMAGE
          type: string
        - name: REPO_URL
          type: string
        - name: REVISION
          type: string
        volumes:
        - name: test-input
          emptyDir: {}
        - name: test-state
          emptyDir: {}
        sidecars:
        - name: workbench
          image: $(params.IMAGE)
          command:
          - /bin/bash
          - -c
          - |
            set -Eeuo pipefail
            export HOME=/opt/app-root/src
            export PATH=/opt/app-root/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            export NOTEBOOK_BASE_URL=/notebook/offline/
            export NOTEBOOK_ARGS="--ServerApp.port=8888
            --ServerApp.token=''
            --ServerApp.password=''
            --ServerApp.quit_button=False"
            /usr/bin/git config --global user.name "Offline Browser Fixture"
            /usr/bin/git config --global user.email offline-browser@example.invalid
            mkdir -p /opt/app-root/src/offline-git-remote.git /opt/app-root/src/offline-git-repo
            /usr/bin/git -C /opt/app-root/src/offline-git-remote.git init --bare
            /usr/bin/git -C /opt/app-root/src/offline-git-repo init
            printf '%s\n' 'initial content' >/opt/app-root/src/offline-git-repo/git-ui.txt
            /usr/bin/git -C /opt/app-root/src/offline-git-repo add git-ui.txt
            /usr/bin/git -C /opt/app-root/src/offline-git-repo commit -m 'initial offline fixture'
            /usr/bin/git -C /opt/app-root/src/offline-git-repo remote add origin \
              file:///opt/app-root/src/offline-git-remote.git
            exec /opt/app-root/bin/start-notebook.sh
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: '1'
              memory: 4Gi
        - name: browser
          image: quay.io/opendatahub/workbench-images-tests@sha256:a4f85171ac50dbe8222986b1ea91c3ef97397e2b96242c122aa4c3dbb33c81ac
          command:
          - /bin/bash
          - -c
          - |
            set -Eeuo pipefail
            while [[ ! -f /test-state/input-ready ]]; do
              sleep 1
            done
            deadline=$((SECONDS + 300))
            while (( SECONDS < deadline )); do
              if node -e "fetch('http://127.0.0.1:8888/notebook/offline/api').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"; then
                break
              fi
              sleep 2
            done
            if (( SECONDS >= deadline )); then
              printf '%s\n' '1' >/test-state/exit
              printf '%s\n' 'JupyterLab did not become ready' >/test-state/browser.log
              exit 1
            fi
            if ! cmp -s /test-input/pnpm-lock.yaml pnpm-lock.yaml; then
              printf '%s\n' '1' >/test-state/exit
              printf '%s\n' 'The pinned browser-test image no longer matches tests/browser/pnpm-lock.yaml; rebuild and repin the image' >/test-state/browser.log
              exit 1
            fi
            cp -a /test-input/tests/. tests/
            cp /test-input/playwright.config.ts playwright.config.ts
            cp /test-input/package.json5 package.json5
            cp /test-input/pnpm-lock.yaml pnpm-lock.yaml
            cp /test-input/pnpm-workspace.yaml pnpm-workspace.yaml
            set +e
            ./node_modules/.bin/playwright test --project=chromium --grep @jupyter \
              2>&1 | tee /test-state/browser.log
            status=${PIPESTATUS[0]}
            set -e
            if [[ -f results/junit.xml ]]; then
              cp results/junit.xml /test-state/junit.xml
            fi
            printf '%s\n' "${status}" >/test-state/exit
            exit "${status}"
          env:
          - name: CI
            value: 'true'
          - name: OFFLINE_BASE_URL
            value: http://127.0.0.1:8888/notebook/offline/
          - name: OFFLINE_FAKE_VALUE
            value: konflux-browser-fixture
          resources:
            requests:
              cpu: '1'
              memory: 2Gi
            limits:
              cpu: '2'
              memory: 4Gi
          volumeMounts:
          - name: test-input
            mountPath: /test-input
          - name: test-state
            mountPath: /test-state
        steps:
        - name: run-browser-test
          image: quay.io/rhoai/rhoai-task-toolset:notebooks
          workingDir: /workspace
          script: |
            #!/bin/bash
            set -Eeuo pipefail
            git init /workspace/source
            git -C /workspace/source remote add origin "$(params.REPO_URL)"
            git -C /workspace/source fetch --depth=1 origin "$(params.REVISION)"
            git -C /workspace/source checkout FETCH_HEAD
            if ! grep -Eq '"@playwright/test"[[:space:]]*:[[:space:]]*"=1\.63\.0"' \
              /workspace/source/tests/browser/package.json5; then
              echo 'The pinned browser-test image is Playwright 1.63.0; update it when tests/browser/package.json5 changes' >&2
              exit 1
            fi
            mkdir -p /test-input/tests
            cp -a /workspace/source/tests/browser/tests/. /test-input/tests/
            cp /workspace/source/tests/browser/playwright.config.ts /test-input/
            cp /workspace/source/tests/browser/package.json5 /test-input/
            cp /workspace/source/tests/browser/pnpm-lock.yaml /test-input/
            cp /workspace/source/tests/browser/pnpm-workspace.yaml /test-input/
            touch /test-state/input-ready
            deadline=$((SECONDS + 1500))
            while [[ ! -f /test-state/exit ]]; do
              if (( SECONDS >= deadline )); then
                echo 'Browser test timed out' >&2
                exit 1
              fi
              sleep 5
            done
            cat /test-state/browser.log
            if [[ -f /test-state/junit.xml ]]; then
              cat /test-state/junit.xml
            fi
            exit "$(cat /test-state/exit)"
          volumeMounts:
          - name: test-input
            mountPath: /test-input
          - name: test-state
            mountPath: /test-state
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-workbench-jupyter-minimal-cpu-py312-ubi9
