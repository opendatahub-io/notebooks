---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/opendatahub-io/notebooks?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: 'true'
    pipelinesascode.tekton.dev/max-keep-runs: '3'
    pipelinesascode.tekton.dev/on-comment: ^/(test-jupyter-minimal-e2e|retest-jupyter-minimal-e2e)$
  labels:
    appstudio.openshift.io/application: opendatahub-release
    appstudio.openshift.io/component: odh-workbench-jupyter-minimal-cpu-py312-ubi9
    kueue.x-k8s.io/priority-class: konflux-pre-merge-test
    pipelines.appstudio.openshift.io/type: test
  name: odh-workbench-jupyter-minimal-cpu-py312-ubi9-e2e-test
  namespace: open-data-hub-tenant
spec:
  timeouts:
    pipeline: 6h
    tasks: 6h
  params:
  - name: image
    value: quay.io/opendatahub/odh-workbench-jupyter-minimal-cpu-py312-ubi9:on-pr-{{revision}}
  - name: repo-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  pipelineSpec:
    params:
    - name: image
      type: string
    - name: repo-url
      type: string
    - name: revision
      type: string
    tasks:
    - name: wait-for-image
      params:
      - name: image
        value: $(params.image)
      taskSpec:
        params:
        - name: image
          type: string
        results:
        - name: IMAGE
          description: Immutable image reference
        steps:
        - name: resolve
          image: quay.io/konflux-ci/konflux-test:stable
          env:
          - name: IMAGE
            value: $(params.image)
          script: |
            #!/bin/bash
            set -Eeuo pipefail
            deadline=$((SECONDS + 300))
            while (( SECONDS < deadline )); do
              if digest="$(skopeo inspect --format '{{.Digest}}' "docker://${IMAGE}" 2>/dev/null)"; then
                repository="${IMAGE%%:*}"
                printf '%s@%s' "${repository}" "${digest}" > "$(results.IMAGE.path)"
                cat "$(results.IMAGE.path)"
                exit 0
              fi
              echo "Waiting briefly for ${IMAGE} to become visible in the registry"
              sleep 10
            done
            echo "Timed out waiting for ${IMAGE}" >&2
            exit 1
    - name: e2e-test
      runAfter:
      - wait-for-image
      params:
      - name: IMAGE
        value: $(tasks.wait-for-image.results.IMAGE)
      - name: REPO_URL
        value: $(params.repo-url)
      - name: REVISION
        value: $(params.revision)
      taskSpec:
        params:
        - name: IMAGE
          type: string
        - name: REPO_URL
          type: string
        - name: REVISION
          type: string
        volumes:
        - name: test-input
          emptyDir: {}
        - name: test-state
          emptyDir: {}
        sidecars:
        - name: workbench
          image: $(params.IMAGE)
          command:
          - /bin/bash
          - -c
          - |
            set -Eeuo pipefail
            while [[ ! -f /test-state/input-ready ]]; do
              sleep 1
            done
            export NOTEBOOK_BASE_URL=/notebook/e2e/
            export NOTEBOOK_ARGS="--ServerApp.port=8888
            --ServerApp.token=''
            --ServerApp.password=''
            --ServerApp.quit_button=False"
            set +e
            python3 -m pip install 'papermill==2.7.0'
            status=$?
            set -e
            if (( status != 0 )); then
              printf '%s\n' "${status}" >/test-state/exit
              printf '%s\n' 'Failed to install Papermill in the workbench sidecar' >/test-state/e2e.log
              exit "${status}"
            fi
            start-notebook.sh &
            server_pid=$!
            cleanup() {
              kill -TERM "${server_pid}" 2>/dev/null || true
              wait "${server_pid}" 2>/dev/null || true
            }
            trap cleanup EXIT
            trap 'exit 130' INT
            trap 'exit 143' TERM
            deadline=$((SECONDS + 300))
            while (( SECONDS < deadline )); do
              if python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/notebook/e2e/api', timeout=2).read()" >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            if (( SECONDS >= deadline )); then
              printf '%s\n' '1' >/test-state/exit
              printf '%s\n' 'JupyterLab did not become ready' >/test-state/e2e.log
              exit 1
            fi
            cp /test-input/test_notebook.ipynb /opt/app-root/src/test_notebook.ipynb
            cp /test-input/expected_versions.json /opt/app-root/src/expected_versions.json
            cd /opt/app-root/src
            set +e
            python3 -m papermill test_notebook.ipynb /test-state/test_notebook_output.ipynb \
              --kernel python3 --start-timeout 300 --log-level DEBUG \
              --stderr-file /test-state/test_notebook_error.txt
            status=$?
            set -e
            if (( status == 0 )) && grep -q FAILED /test-state/test_notebook_error.txt; then
              status=1
            fi
            printf '%s\n' "${status}" >/test-state/exit
            exit "${status}"
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: '1'
              memory: 4Gi
          volumeMounts:
          - name: test-input
            mountPath: /test-input
          - name: test-state
            mountPath: /test-state
        steps:
        - name: run-e2e-test
          image: quay.io/rhoai/rhoai-task-toolset:notebooks
          workingDir: /workspace
          script: |
            #!/bin/bash
            set -Eeuo pipefail
            git init /workspace/source
            git -C /workspace/source remote add origin "$(params.REPO_URL)"
            git -C /workspace/source fetch --depth=1 origin "$(params.REVISION)"
            git -C /workspace/source checkout FETCH_HEAD
            python3 - <<'PY'
            import json
            import re
            from pathlib import Path

            source = Path('/workspace/source')
            manifest = source / 'manifests/odh/base/jupyter-minimal-notebook-imagestream.yaml'
            requirements = source / 'jupyter/minimal/ubi9-python-3.12/requirements.cpu.txt'

            def annotation_json(key):
                collected = []
                key_indent = None
                for line in manifest.read_text().splitlines():
                    stripped = line.lstrip()
                    if key_indent is None:
                        if stripped.startswith(f'{key}:'):
                            key_indent = len(line) - len(stripped)
                        continue
                    if not line.strip():
                        collected.append('')
                        continue
                    current_indent = len(line) - len(stripped)
                    if current_indent <= key_indent:
                        break
                    collected.append(line[key_indent + 2:])
                if not collected:
                    raise ValueError(f'Missing {key} annotation in {manifest}')
                return json.loads('\n'.join(collected))

            def requirement_version(package):
                match = re.search(
                    rf'(?m)^{re.escape(package)}==(\d+\.\d+)',
                    requirements.read_text(),
                )
                if match is None:
                    raise ValueError(f'Missing {package} pin in {requirements}')
                return match.group(1)

            expected = {
                entry['name']: entry['version']
                for key in (
                    'opendatahub.io/notebook-software',
                    'opendatahub.io/notebook-python-dependencies',
                )
                for entry in annotation_json(key)
            }
            expected['nbdime'] = requirement_version('nbdime')
            expected['nbgitpuller'] = requirement_version('nbgitpuller')
            Path('/test-input/expected_versions.json').write_text(
                json.dumps(expected, indent=2) + '\n',
            )
            PY
            cp /workspace/source/jupyter/minimal/ubi9-python-3.12/test/test_notebook.ipynb \
              /test-input/test_notebook.ipynb
            touch /test-state/input-ready
            deadline=$((SECONDS + 1500))
            while [[ ! -f /test-state/exit ]]; do
              if (( SECONDS >= deadline )); then
                echo 'E2E test timed out' >&2
                exit 1
              fi
              sleep 5
            done
            if [[ -f /test-state/e2e.log ]]; then
              cat /test-state/e2e.log
            fi
            if [[ -f /test-state/test_notebook_error.txt ]]; then
              cat /test-state/test_notebook_error.txt
            fi
            exit "$(cat /test-state/exit)"
          volumeMounts:
          - name: test-input
            mountPath: /test-input
          - name: test-state
            mountPath: /test-state
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-workbench-jupyter-minimal-cpu-py312-ubi9
