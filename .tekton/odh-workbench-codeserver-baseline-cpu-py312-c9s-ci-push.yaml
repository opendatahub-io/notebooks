      type: npm
  - name: additional-tags
    value:
    - 3.6_ea2-v1.49
  taskRunSpecs:
  - pipelineTaskName: prefetch-dependencies
    computeResources:
      requests:
        cpu: '4'
        memory: 8Gi
      limits:
        cpu: '4'
        memory: 8Gi
  - pipelineTaskName: build-images
    stepSpecs:
    - name: build
      computeResources:
        requests:
          cpu: '8'
          memory: 16Gi
          ephemeral-storage: 80Gi
        limits:
          cpu: '8'
          memory: 16Gi
          ephemeral-storage: 80Gi
    - name: prepare-sboms
      computeResources:
        requests:
          cpu: '4'
          memory: 8Gi
        limits:
          cpu: '4'
          memory: 8Gi
    - name: sbom-syft-generate
      computeResources:
        requests:
          cpu: '4'
          memory: 8Gi
        limits:
          cpu: '4'
          memory: 8Gi
  - pipelineTaskName: sast-unicode-check
    computeResources:
      limits:
        memory: 8Gi
  - pipelineTaskName: clair-scan
    computeResources:
      requests:
        cpu: '8'
        memory: 8Gi
      limits:
        cpu: '8'
        memory: 8Gi
  - pipelineTaskName: ecosystem-cert-preflight-checks
    computeResources:
      requests:
        cpu: '4'
        memory: 8Gi
      limits:
        cpu: '4'
        memory: 8Gi
  - pipelineTaskName: clamav-scan
    computeResources:
      limits:
        memory: 8Gi
  - pipelineTaskName: sast-shell-check
    computeResources:
      limits:
        memory: 8Gi
  - pipelineTaskName: rpms-signature-scan
    computeResources:
      limits:
        memory: 8Gi
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/opendatahub-io/odh-konflux-central.git
    - name: revision
      value: main
    - name: pathInRepo
      value: pipeline/multi-arch-container-build.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-workbench-codeserver-baseline-cpu-py312-c9s-ci
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
