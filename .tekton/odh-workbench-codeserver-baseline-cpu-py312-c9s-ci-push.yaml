apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/opendatahub-io/notebooks?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push" && target_branch == "stable" &&
      !("manifests/base/params-latest.env".pathChanged()) &&
      (
        ".tekton/odh-workbench-codeserver-baseline-cpu-py312-c9s-ci-push.yaml".pathChanged() ||
        "codeserver-baseline/ubi9-python-3.12/**".pathChanged() ||
        "codeserver-baseline/ubi9-python-3.12/build-args/cpu.conf".pathChanged()
      )
  labels:
    appstudio.openshift.io/application: opendatahub-builds
    appstudio.openshift.io/component: odh-workbench-codeserver-baseline-cpu-py312-c9s-ci
    pipelines.appstudio.openshift.io/type: build
  name: odh-workbench-codeserver-baseline-cpu-py312-c9s-ci-on-push
  namespace: open-data-hub-tenant
spec:
  timeouts:
    pipeline: 6h
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/opendatahub/odh-workbench-codeserver-baseline-cpu-py312-c9s:odh-stable
  - name: build-platforms
    value:
    - linux/x86_64
    - linux-m2xlarge/arm64
    - linux/ppc64le
    - linux/s390x
  - name: dockerfile
    value: codeserver-baseline/ubi9-python-3.12/Dockerfile.konflux.cpu
  - name: build-args-file
    value: codeserver-baseline/ubi9-python-3.12/build-args/cpu.conf
  - name: path-context
    value: .
  - name: hermetic
    value: 'true'
  - name: prefetch-input
    value:
    - path: codeserver-baseline/ubi9-python-3.12/prefetch-input/odh
      type: rpm
    - path: codeserver-baseline/ubi9-python-3.12/prefetch-input/odh
      type: generic
    - path: codeserver-baseline/ubi9-python-3.12
      type: pip
      binary:
        arch: x86_64,aarch64,ppc64le,s390x
      requirements_files: [requirements.cpu.txt]
    - path: codeserver-baseline/ubi9-python-3.12/prefetch-input/code-server/lib/vscode/.vscode/extensions/vscode-selfhost-import-aid
      type: npm
    - path: codeserver-baseline/ubi9-python-3.12/prefetch-input/code-server/lib/vscode/.vscode/extensions/vscode-selfhost-test-provider
