
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/red-hat-data-services/notebooks?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    build.appstudio.openshift.io/build-nudge-files: "build/operator-nudging.yaml"
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push"
      && target_branch == "rhoai-3.6-ea.1"
      && ( files.all.exists(p, !p.matches('^\\.tekton/')) || ".tekton/odh-workbench-codeserver-baseline-cpu-py312-v3-6-ea-1-push.yaml".pathChanged() )
  labels:
    appstudio.openshift.io/application: rhoai-v3-6-ea-1
    appstudio.openshift.io/component: odh-workbench-codeserver-baseline-cpu-py312-v3-6-ea-1
    pipelines.appstudio.openshift.io/type: build
  name: odh-workbench-codeserver-baseline-cpu-py312-v3-6-ea-1-on-push
  namespace: rhoai-tenant
spec:
  timeouts:
    pipeline: 8h
    tasks: 4h
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: additional-tags
    value:
    - '{{target_branch}}-{{revision}}'
  - name: output-image
    value: quay.io/rhoai/odh-workbench-codeserver-baseline-cpu-py312-rhel9:{{target_branch}}
  - name: rhoai-version
    value: "3.6.0-ea.1"
  - name: dockerfile
    value: codeserver-baseline/ubi9-python-3.12/Dockerfile.konflux.cpu
  - name: path-context
    value: .
  - name: hermetic
    value: false
  - name: rhel-subscription-activation-key
    value: rhel-subscription-activation-key-rhoai-devops-for-notebooks-rhel9-6
  - name: build-platforms
    value:
    - linux-d160-m8xlarge/amd64
    - linux-d160-m8xlarge/arm64
    - linux/ppc64le
    - linux/s390x
  - name: build-args-file
    value: codeserver-baseline/ubi9-python-3.12/build-args/konflux.cpu.conf
  pipelineRef:
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    - name: revision
      value: '{{ target_branch }}'
    - name: pathInRepo
      value: pipelines/multi-arch-container-build.yaml
    resolver: git
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-workbench-codeserver-baseline-cpu-py312-v3-6-ea-1
    podTemplate:
      imagePullSecrets:
      - name: redhat-appstudio-staginguser-pull-secret
  timeouts:
    pipeline: 2h
