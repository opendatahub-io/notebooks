apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/opendatahub-io/notebooks?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push" && target_branch == "stable" &&
      !("manifests/base/params-latest.env".pathChanged()) &&
      (
        ".tekton/odh-workbench-jupyter-baseline-cpu-py312-c9s-push.yaml".pathChanged() ||
        "jupyter/baseline/ubi9-python-3.12/**".pathChanged() ||
        "jupyter/baseline/ubi9-python-3.12/build-args/cpu.conf".pathChanged() ||
        "jupyter/utils/**".pathChanged() ||
        "jupyter/minimal/ubi9-python-3.12/start-notebook.sh".pathChanged()
      )
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: opendatahub-builds
    appstudio.openshift.io/component: odh-workbench-jupyter-baseline-cpu-py312-c9s-ci
    pipelines.appstudio.openshift.io/type: build
  name: odh-workbench-jupyter-baseline-cpu-py312-c9s-on-push
  namespace: open-data-hub-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/opendatahub/odh-workbench-jupyter-baseline-cpu-py312-c9s:odh-stable
  - name: dockerfile
    value: jupyter/baseline/ubi9-python-3.12/Dockerfile.konflux.cpu
  - name: path-context
    value: .
  - name: build-args-file
    value: jupyter/baseline/ubi9-python-3.12/build-args/cpu.conf
  - name: build-platforms
    value:
    - linux/x86_64
    - linux-m2xlarge/arm64
    - linux/ppc64le
    - linux/s390x
  - name: hermetic
    value: true
  - name: prefetch-input
    value:
    - path: prefetch-input/odh
      type: rpm
    - path: prefetch-input/odh
      type: generic
    - path: jupyter/baseline/ubi9-python-3.12
      type: pip
      binary:
        arch: "x86_64,aarch64,ppc64le,s390x"
      requirements_files: [requirements.cpu.txt]
  - name: additional-tags
    value:
    - 3.6_ea2-v1.49
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/opendatahub-io/odh-konflux-central.git
    - name: revision
      value: main
    - name: pathInRepo
      value: pipeline/multi-arch-container-build.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-workbench-jupyter-baseline-cpu-py312-c9s-ci
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
