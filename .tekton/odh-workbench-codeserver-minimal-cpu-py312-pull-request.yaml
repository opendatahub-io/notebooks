apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/red-hat-data-services/notebooks?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-comment: "^/(build-konflux|build-codeserver)"
    build.appstudio.redhat.com/pull_request_number: "{{pull_request_number}}"
    pipelinesascode.tekton.dev/on-cel-expression: |-
      event == "pull_request"
      && ! ("manifests/rhoai/base/params-latest.env".pathChanged())
      && (".tekton/odh-workbench-codeserver-minimal-cpu-py312-pull-request.yaml".pathChanged() || "codeserver-minimal/ubi9-python-3.12/**".pathChanged() || "codeserver-minimal/ubi9-python-3.12/build-args/konflux.cpu.conf".pathChanged())
  labels:
    appstudio.openshift.io/application: automation
    appstudio.openshift.io/component: pr-pipelines-odh-workbench-codeserver-minimal-cpu-py312
    pipelines.appstudio.openshift.io/type: build
  name: odh-workbench-codeserver-minimal-cpu-py312-pull-request-{{pull_request_number}}
  namespace: rhoai-tenant
spec:
  timeouts:
    pipeline: 8h0m0s
    tasks: "4h0m0s"
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/rhoai/odh-workbench-codeserver-minimal-cpu-py312-rhel9:on-pr-{{pull_request_number}}
  - name: additional-labels
    value:
    - version=on-pr-{{revision}}
    - io.openshift.tags=odh-workbench-codeserver-minimal-cpu-py312
  - name: dockerfile
    value: codeserver-minimal/ubi9-python-3.12/Dockerfile.konflux.cpu
  - name: build-args-file
    value: codeserver-minimal/ubi9-python-3.12/build-args/konflux.cpu.conf
  - name: path-context
    value: .
  - name: enable-cache-proxy
    value: true
  - name: hermetic
    value: true
  - name: build-image-index
    value: true
  - name: build-platforms
    value:
    - linux-d160-m8xlarge/amd64
    - linux-d160-m8xlarge/arm64
    - linux/ppc64le
    - linux/s390x
  - name: image-expires-after
    value: 30d
  - name: enable-slack-failure-notification
    value: "false"
  - name: rhel-subscription-activation-key
    value: "rhel-subscription-activation-key-rhoai-devops-for-notebooks-rhel9-6"
  - name: rhoai-version
    value: "3.6.0"
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    - name: revision
      value: '{{ cel: pac.target_branch.matches("^rhoai-\\d+\\.\\d+(-ea\\.\\d+)?$") ? pac.target_branch : "main" }}'
    - name: pathInRepo
      value: pipelines/multi-arch-container-build.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-pr-pipelines-odh-workbench-codeserver-minimal-cpu-py312
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
