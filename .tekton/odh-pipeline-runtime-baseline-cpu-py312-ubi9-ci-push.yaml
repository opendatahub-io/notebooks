---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/opendatahub-io/notebooks?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    build.appstudio.openshift.io/build-nudge-files: "manifests/base/params-latest.env"
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push" && target_branch == "stable" &&
      !("manifests/base/params-latest.env".pathChanged()) &&
      (
        ".tekton/odh-pipeline-runtime-baseline-cpu-py312-ubi9-ci-push.yaml".pathChanged() ||
        "runtimes/baseline/ubi9-python-3.12/**".pathChanged()
      )
  labels:
    appstudio.openshift.io/application: opendatahub-builds
    appstudio.openshift.io/component: odh-pipeline-runtime-baseline-cpu-py312-c9s-ci
    pipelines.appstudio.openshift.io/type: build
  name: odh-pipeline-runtime-baseline-cpu-py312-ubi9-ci-on-push
  namespace: open-data-hub-tenant
spec:
  timeouts:
    pipeline: 6h
  params:
  - name: event-type
    value: '{{event_type}}'
  - name: enable-cache-proxy
    value: 'true'
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/opendatahub/odh-pipeline-runtime-baseline-cpu-py312-c9s:odh-stable
  - name: dockerfile
    value: runtimes/baseline/ubi9-python-3.12/Dockerfile.konflux.cpu
  - name: build-args-file
    value: runtimes/baseline/ubi9-python-3.12/build-args/cpu.conf
  # Phase 1: non-hermetic online RPM + PyPI install (see Dockerfile header).
  - name: hermetic
    value: 'false'
  - name: path-context
    value: .
  - name: additional-tags
    value:
    - 3.6_ea1-v1.47
  - name: build-platforms
    value:
    - linux-mxlarge/amd64
    - linux-mxlarge/arm64
  taskRunSpecs:
  - pipelineTaskName: build-images
    stepSpecs:
    - name: prepare-sboms
      computeResources:
        requests:
          cpu: '8'
          memory: 32Gi
        limits:
          cpu: '8'
          memory: 32Gi
    - name: sbom-syft-generate
      computeResources:
        requests:
          cpu: '8'
          memory: 32Gi
        limits:
          cpu: '8'
          memory: 32Gi
    - name: build
      computeResources:
        requests:
          cpu: '8'
          memory: 16Gi
        limits:
          cpu: '16'
          memory: 32Gi
  - pipelineTaskName: sast-unicode-check
    computeResources:
      limits:
        memory: 8Gi
  - pipelineTaskName: clair-scan
    computeResources:
      limits:
        memory: 8Gi
  - pipelineTaskName: ecosystem-cert-preflight-checks
    computeResources:
      limits:
        memory: 8Gi
  - pipelineTaskName: clamav-scan
    computeResources:
      limits:
        memory: 8Gi
  - pipelineTaskName: sast-shell-check
    computeResources:
      limits:
        memory: 8Gi
  - pipelineTaskName: rpms-signature-scan
    computeResources:
      limits:
        memory: 8Gi
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/opendatahub-io/odh-konflux-central.git
    - name: revision
      value: main
    - name: pathInRepo
      value: pipeline/multi-arch-container-build.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-pipeline-runtime-baseline-cpu-py312-c9s-ci
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
