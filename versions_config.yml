# yaml-language-server: $schema=./ci/versions_config.schema.json
# =============================================================================
# IMPORTANT: PRIMARY RELEASE COMMANDS
# - New release stream (for example, 3.5 -> 3.6):
#     1) Update full_version in this file and preferred image versions.
#     2) Run: make kickoff-release
# - Mid-release image version updates:
#     1) Update preferred image versions in this file.
#     2) Run: make sync-build-args-from-versions
#     3) Run: make refresh-lock-files to refresh the lock files.
# =============================================================================
---
schema_version: 1

release:
  full_version: "3.6.0"
  rhds_os_base: "el9.8"
  python_version: "3.12"

artifacts:
  base_image:
    # Shared CPU policy for managed non-baseline CPU workbenches/runtimes that
    # have both ODH (cpu.conf) and RHOAI (konflux.cpu.conf) build-args, including:
    # jupyter/{minimal,datascience,trustyai,universal}, runtimes/*,
    # codeserver/*, and codeserver-minimal/*.
    # jupyter/universal uses this block (RH-index + AIPCC for RHOAI), not baseline_cpu.
    cpu:
      channel_torch_version: "2.13"
      rhds:
        channel: stable
      odh:
        origin: in-house
        version: "latest"

    # ODH-only public-index baseline families (jupyter/baseline, runtimes/baseline,
    # codeserver-baseline). No konflux.cpu.conf / RHDS prefetch.
    baseline_cpu:
      odh:
        origin: in-house
        version: latest

    cuda:
      minimal:
        acc_version: "13.0"
        channel_torch_version: "2.13"
        rhds:
          channel: stable
        odh:
          origin: in-house
      pytorch:
        acc_version: "13.0"
        channel_torch_version: "2.13"
        rhds:
          channel: stable
        odh:
          origin: in-house
      pytorch-llmcompressor:
        acc_version: "13.0"
        channel_torch_version: "2.13"
        rhds:
          channel: stable
        odh:
          origin: in-house
      tensorflow:
        acc_version: "12.9"
        channel_torch_version: "2.13"
        rhds:
          channel: stable
        odh:
          origin: in-house
    rocm:
      minimal:
        acc_version: "7.14"
        channel_torch_version: "2.12"
        rhds:
          channel: stable
        odh:
          origin: in-house
      pytorch:
        acc_version: "7.14"
        channel_torch_version: "2.12"
        rhds:
          channel: stable
        odh:
          origin: in-house
      tensorflow:
        acc_version: "7.14"
        channel_torch_version: "2.12"
        rhds:
          channel: stable
        odh:
          origin: in-house
