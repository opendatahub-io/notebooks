# https://github.com/cri-o/cri-o/blob/main/docs/crio.conf.5.md

[crio]
storage_driver = "overlay"
# storage_option = [ "overlay.mountopt=nodev,metacopy=on" ]

# reuse podman's graphroot because we have huge images that don't fit on disk twice
root = "/mnt/containers/storage"
# runroot should probably match what podman does too (currently not set for either)

# Ubuntu 26.04 AppArmor converts an unprivileged profile transition into
# stacking (crio-default//&unconfined). crio-default cannot signal that peer,
# so os.kill returns EPERM. Papermill then fails "Run image tests" while
# shutting the kernel down, after the notebook assertions have passed.
# This cluster only runs image tests. "unconfined" skips installing crio-default
# (CRI-O LoadProfile treats that name as disabling AppArmor).
[crio.runtime]
apparmor_profile = "unconfined"

# https://stackoverflow.com/questions/62408028/kubelet-failed-to-createpodsandbox-for-coredns-failed-to-set-bridge-addr-c
[crio.network]
# the /etc/cni/net.d/11-crio-ipv4-bridge.conflist default IPs confilct with flannel,
# older versions of kubernetes the kubelet was touching the cni, now only the container runtime touches
# c.f. https://kubernetes.io/docs/concepts/extend-kubernetes/compute-storage-net/network-plugins/#installation
#network_dir = "/etc/cni/net.d-kube/"
