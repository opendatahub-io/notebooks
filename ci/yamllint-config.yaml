---

extends: default

ignore: |
  # Synced from konflux-central; never modify in this repo directly.
  .tekton/
  # Machine-generated RPM lockfiles (non-configurable indentation).
  **/rpms.lock.yaml
  # Python virtualenv (gitignored; absent in CI lint job).
  .venv/

rules:
  line-length: disable
  new-line-at-end-of-file:
    level: warning

  document-start:
    ignore:
      # generated file
      - 'pnpm-lock.yaml'
      # synced from opendatahub-io/security-config, protected by org push ruleset
      - '.coderabbit.yaml'
      - 'semgrep.yaml'
