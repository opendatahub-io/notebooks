[project]
name = "rocm-tensorflow-ubi9-python-3.12"
version = "0.1.0"
requires-python = "==3.12.*"

dependencies = [
    "tf2onnx~=1.16.1",

    # ROCm TensorFlow packages
    # https://rocm.docs.amd.com/projects/install-on-linux/en/latest/install/3rd-party/tensorflow-install.html#using-a-wheels-package
    # TODO(jdanek): consider adding #sha256=814a5e4842b0c92d63c7a0bb4df0baf51ff2db8615535d83fe8958204b840598
    "tensorflow-rocm @ https://repo.radeon.com/rocm/manylinux/rocm-rel-6.4/tensorflow_rocm-2.18.1-cp312-cp312-manylinux_2_28_x86_64.whl",
    # tensorflow-rocm==2.x needs tensorboard>=2.x,<2.x+1
    "tensorboard~=2.18.0",

    # Datascience and useful extensions
    "boto3~=1.40.52",
    "kafka-python-ng~=2.2.3",
    "matplotlib~=3.10.7",
    # Match CUDA tensorflow runtime; numpy 1.26 conflicts with onnx>=1.21.0 via ml-dtypes
    "numpy~=2.1.3",
    "pandas~=2.3.3",
    "plotly~=6.3.1",
    "scikit-learn~=1.7.2",
    "scipy~=1.16.2",
    "skl2onnx~=1.19.1",
    # Required for skl2onnx, as upgraded version is not compatible with protobuf
    "onnxconverter-common~=1.13.0",
    "codeflare-sdk~=0.34.0",

    # DB connectors
    "pymongo~=4.15.3",
    "psycopg~=3.2.10",
    "pyodbc~=5.2.0",
    "mysql-connector-python~=9.4.0",

    "odh-notebooks-meta-runtime-elyra-deps",

    # Base packages
    "setuptools==80.9.0",
    "wheel~=0.46.2",
]

[tool.uv]

override-dependencies = [
    # RHAIENG-5052: CVE-2026-39892 — force past codeflare-sdk==0.34.0 pin cryptography==46.0.3
    "cryptography>=46.0.7",
    # RHOAIENG-59282 + RHOAIENG-54270: CVE-2026-23490 + CVE-2026-30922 pyasn1 DoS vulnerabilities
    "pyasn1>=0.6.4",
    # tf2onnx has pinned protobuf version, that causes conflict with other packages
    "protobuf==6.31.1",
    # RHAIENG-6359: CVE-2026-12484; match CUDA tensorflow runtime
    "keras~=3.15.0",
    # AMD tensorflow-rocm==2.18.1 declares numpy<2.1.0; AIPCC ships TF-ROCm 2.20 + numpy 2.x.
    # Override lifts that upper bound while keeping the same 2.1.x range as CUDA tensorflow.
    "numpy>=2.1.3,<2.2",
]

constraint-dependencies = [
    # RHAIENG-4275: CVE-2026-27489 ONNX path traversal vulnerability
    # Replaces stale onnx<1.19.0 (ml_dtypes float4_e2m1fn issue resolved by ml_dtypes>=0.5.0)
    "onnx>=1.22.0",
]

environments = [
    "sys_platform == 'linux' and implementation_name == 'cpython'",
]

[tool.uv.sources]
odh-notebooks-meta-runtime-elyra-deps = { path = "../../../dependencies/odh-notebooks-meta-runtime-elyra-deps" }
