[project]
name = "minimal-notebook"
version = "0.1.0"
requires-python = "==3.12.*"

dependencies = [
    "odh-notebooks-meta-runtime-elyra-deps",
    "odh-notebooks-meta-runtime-kale-deps",

    # Base packages
    "setuptools",
    "wheel",

    # Hermetic bootstrap: locked in requirements.*.txt; Dockerfile installs unpinned from find-links.
    "micropipenv[toml]",
    "uv",
]

[tool.uv]
# RHAIENG-5451 / RHAIENG-7088: fail at lock-generation time (not inside the
# Konflux build) if a package version lacks wheels for any architecture this
# image ships. See opendatahub-io/notebooks#4422 for the dynamic alternative.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'ppc64le'",
    "sys_platform == 'linux' and platform_machine == 's390x'",
]
environments = [
    "sys_platform == 'linux' and implementation_name == 'cpython' and python_full_version == '3.12.*'",
]

[tool.uv.sources]
odh-notebooks-meta-runtime-elyra-deps = { path = "../../../dependencies/odh-notebooks-meta-runtime-elyra-deps" }
odh-notebooks-meta-runtime-kale-deps = { path = "../../../dependencies/odh-notebooks-meta-runtime-kale-deps" }
