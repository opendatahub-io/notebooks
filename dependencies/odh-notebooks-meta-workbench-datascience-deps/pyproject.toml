[project]
name = "odh-notebooks-meta-workbench-datascience-deps"
version = "0.1.0"
requires-python = "==3.12.*"

dependencies = [
    # Core Data Science Libraries
    "numpy",
    # RHAIENG-7790: pin below the pandas 2.3 pickle regression (RHOAIENG-99347).
    # 3.0.6 is fixed but feast/mlflow cap pandas<3. TrustyAI overrides this to >=3.0.1.
    "pandas==2.2.3",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "plotly",

    # ML/MLOps Tools
    "kfp",
    "mlflow",

    # NOTE: skl2onnx is added directly in consuming pyproject.toml files
    # because codeserver needs s390x exclusion marker while jupyter notebooks don't
    "onnxconverter-common",

    # Cloud/Infrastructure
    "boto3",
    "kafka-python-ng",

    # Workbench extensions
    "codeflare-sdk; platform_machine != 'ppc64le' and platform_machine != 's390x'",
    "feast",
]

[tool.uv]
package = false
# FIPS: py-spy is a statically linked Rust profiler pulled transitively by Ray
# (codeflare-sdk). Not required for codeflare-sdk or feast runtime.
exclude-dependencies = ["py-spy"]

environments = [
    "sys_platform == 'linux' and implementation_name == 'cpython' and python_full_version == '3.12.*'",
]
