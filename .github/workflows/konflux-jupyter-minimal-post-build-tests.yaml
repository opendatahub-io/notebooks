---
name: Test

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/konflux-jupyter-minimal-post-build-tests.yaml
      - .tekton/odh-workbench-jupyter-minimal-cpu-py312-ubi9-pull-request.yaml
      - jupyter/utils/**
      - jupyter/minimal/ubi9-python-3.12/**
      - jupyter/minimal/ubi9-python-3.12/build-args/cpu.conf
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      commit_sha:
        description: Pull request head commit SHA
        required: true
        type: string
      use_ibm_runners:
        description: Use native IBM runners for ppc64le and s390x
        required: false
        default: false
        type: boolean
      container_platforms:
        description: Comma-separated architectures for Testcontainers tests
        required: false
        default: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
        type: string
      browser_platforms:
        description: >-
          Comma-separated architectures for browser tests (Playwright image supports
          linux/amd64 and linux/arm64 only)
        required: false
        default: linux/amd64,linux/arm64
        type: string
      e2e_platforms:
        description: Comma-separated architectures for E2E tests
        required: false
        default: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
        type: string
      openshift_platforms:
        description: Comma-separated architectures for OpenShift tests
        required: false
        default: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
        type: string

concurrency:
  group: konflux-jupyter-minimal-post-build-tests-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Wait for Konflux image build
    if: >-
      github.repository == 'opendatahub-io/notebooks' && (
        github.event_name == 'pull_request' ||
        github.event_name == 'workflow_dispatch'
      )
    permissions:
      contents: read
      checks: read
      pull-requests: read
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      image: ${{ steps.resolve.outputs.image }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      test_matrix: ${{ steps.matrices.outputs.test_matrix }}
    steps:
      - name: Resolve PR, build, and immutable image
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CHECK_NAME: Red Hat Konflux / odh-workbench-jupyter-minimal-cpu-py312-ubi9-on-pull-request
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.event.inputs.commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          POC_IMAGE: ${{ (github.head_ref || github.ref_name) == 'poc/konflux-jupyter-minimal' && 'quay.io/opendatahub/odh-workbench-jupyter-minimal-cpu-py312-ubi9@sha256:c92e84d44809578692a2cc07378d2133d9641276601a8b6110d0fc0df07c04bf' || '' }}
          POC_IMAGE_TAG: on-pr-86f6fcb4fef6c9128e1415de015058648e9d4e22
        run: |
          set -euo pipefail

          if [[ -z "${COMMIT_SHA}" ]]; then
            echo "::error::Could not resolve commit SHA"
            exit 1
          fi

          if [[ -z "${PR_NUMBER}" ]]; then
            PR_NUMBER="$(
              gh api "repos/${REPO}/commits/${COMMIT_SHA}/pulls" \
                --jq '[.[] | select(.state == "open")][0].number'
            )"
          fi

          head_sha="$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json headRefOid --jq '.headRefOid')"
          if [[ "${head_sha}" != "${COMMIT_SHA}" ]]; then
            echo "Build was for ${COMMIT_SHA}; PR head is ${head_sha}. Skipping stale tests."
            exit 1
          fi

          if [[ -n "${POC_IMAGE}" ]]; then
            image="${POC_IMAGE}"
            image_tag="${POC_IMAGE_TAG}"
            {
              echo "pr_number=${PR_NUMBER}"
              echo "commit_sha=${COMMIT_SHA}"
              echo "image=${image}"
              echo "image_tag=${image_tag}"
            } >> "${GITHUB_OUTPUT}"
            echo "Testing POC image ${image}"
            exit 0
          fi

          check_url="repos/${REPO}/commits/${COMMIT_SHA}/check-runs"
          for attempt in $(seq 1 360); do
            check_state="$(
              gh api "${check_url}" \
                --jq ".check_runs[] | select(.name == \"${CHECK_NAME}\") |
                      ((.status // \"\") + \"/\" + (.conclusion // \"\"))" |
                head -n 1
            )"
            if [[ "${check_state}" == "completed/success" ]]; then
              echo "Konflux build succeeded at attempt ${attempt}/360"
              break
            fi
            if [[ "${check_state}" == completed/* ]]; then
              echo "::error::Konflux build is not successful (${check_state:-missing})"
              exit 1
            fi
            echo "Waiting for Konflux build (attempt ${attempt}/360, ${check_state:-not started})"
            sleep 60
          done

          if [[ "${check_state}" != "completed/success" ]]; then
            echo "::error::Konflux build did not complete within six hours"
            exit 1
          fi

          image_repository="quay.io/opendatahub/odh-workbench-jupyter-minimal-cpu-py312-ubi9"
          image_tag="on-pr-${COMMIT_SHA}"
          manifest_url="https://quay.io/v2/opendatahub/odh-workbench-jupyter-minimal-cpu-py312-ubi9/manifests/${image_tag}"
          manifest_accept='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json'

          for attempt in $(seq 1 60); do
            digest="$(
              curl --silent --show-error --location --max-time 30 \
                --head --header "Accept: ${manifest_accept}" "${manifest_url}" 2>/dev/null |
                awk 'BEGIN { IGNORECASE=1 } /^docker-content-digest:/ { gsub("\r", "", $2); print $2; exit }'
            )"
            if [[ -n "${digest}" ]]; then
              break
            fi
            echo "Waiting for published image (attempt ${attempt}/60)"
            sleep 30
          done

          if [[ -z "${digest}" ]]; then
            echo "::error::Published image did not become available at ${manifest_url}"
            exit 1
          fi

          image="${image_repository}@${digest}"
          {
            echo "pr_number=${PR_NUMBER}"
            echo "commit_sha=${COMMIT_SHA}"
            echo "image=${image}"
            echo "image_tag=${image_tag}"
          } >> "${GITHUB_OUTPUT}"
          echo "Testing ${image}"

      - name: Build architecture matrices
        id: matrices
        env:
          CONTAINER_PLATFORMS: ${{ github.event.inputs.container_platforms || vars.KONFLUX_JUPYTER_MINIMAL_CONTAINER_PLATFORMS || 'linux/amd64,linux/arm64,linux/ppc64le,linux/s390x' }}
          BROWSER_PLATFORMS: ${{ github.event.inputs.browser_platforms || vars.KONFLUX_JUPYTER_MINIMAL_BROWSER_PLATFORMS || 'linux/amd64,linux/arm64' }}
          E2E_PLATFORMS: ${{ github.event.inputs.e2e_platforms || vars.KONFLUX_JUPYTER_MINIMAL_E2E_PLATFORMS || 'linux/amd64,linux/arm64,linux/ppc64le,linux/s390x' }}
          OPENSHIFT_PLATFORMS: ${{ github.event.inputs.openshift_platforms || vars.KONFLUX_JUPYTER_MINIMAL_OPENSHIFT_PLATFORMS || 'linux/amd64,linux/arm64,linux/ppc64le,linux/s390x' }}
          USE_IBM_RUNNERS: ${{ github.event.inputs.use_ibm_runners || false }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          platform_order = [
              "linux/amd64",
              "linux/arm64",
              "linux/ppc64le",
              "linux/s390x",
          ]
          allowed_platforms = set(platform_order)
          browser_supported_platforms = {"linux/amd64", "linux/arm64"}

          def parse_platforms(value, allowed):
              platforms = []
              for platform in value.split(","):
                  platform = platform.strip()
                  if not platform:
                      continue
                  if platform not in allowed:
                      raise SystemExit(f"Unsupported platform {platform!r}")
                  if platform not in platforms:
                      platforms.append(platform)
              if not platforms:
                  raise SystemExit("At least one platform is required")
              return platforms

          container_platforms = parse_platforms(
              os.environ["CONTAINER_PLATFORMS"], allowed_platforms
          )
          browser_platforms = parse_platforms(
              os.environ["BROWSER_PLATFORMS"], browser_supported_platforms
          )
          e2e_platforms = parse_platforms(
              os.environ["E2E_PLATFORMS"], allowed_platforms
          )
          openshift_platforms = parse_platforms(
              os.environ["OPENSHIFT_PLATFORMS"], allowed_platforms
          )
          use_ibm_runners = os.environ["USE_IBM_RUNNERS"].lower() == "true"
          runner_by_platform = {
              "linux/amd64": "ubuntu-26.04",
              "linux/arm64": "ubuntu-26.04-arm",
              "linux/ppc64le": "ubuntu-26.04",
              "linux/s390x": "ubuntu-26.04",
          }
          if use_ibm_runners:
              runner_by_platform["linux/ppc64le"] = "ubuntu-24.04-ppc64le"
              runner_by_platform["linux/s390x"] = "ubuntu-24.04-s390x"

          all_platforms = {
              *container_platforms,
              *browser_platforms,
              *e2e_platforms,
              *openshift_platforms,
          }
          test_matrix = {
              "include": [
                  {
                      "platform": platform,
                      "artifact_name": platform.split("/", 1)[1],
                      "container": platform in container_platforms,
                      "browser": platform in browser_platforms,
                      "e2e": platform in e2e_platforms,
                      "openshift": platform in openshift_platforms,
                      "runner": runner_by_platform[platform],
                      "use_qemu": platform in {"linux/ppc64le", "linux/s390x"} and not use_ibm_runners,
                  }
                  for platform in platform_order
                  if platform in all_platforms
              ]
          }

          outputs = {"test_matrix": test_matrix}
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, value in outputs.items():
                  output.write(f"{name}={json.dumps(value)}\n")
          PY

  test:
    name: Test Jupyter Minimal (${{ matrix.artifact_name }})
    needs: prepare
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.test_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Set up QEMU
        if: ${{ matrix.use_qemu }}
        run: docker run --rm --privileged tonistiigi/binfmt --install ${PLATFORM#*/}
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: ./.github/actions/install-podman-action
        with:
          platform: ${{ matrix.platform }}

      - uses: ./.github/actions/setup-uv

      - name: Sync Python environment
        run: uv sync --locked

      - name: Pull workbench image
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          PLATFORM: ${{ matrix.platform }}
        run: podman pull --platform "${PLATFORM}" "${IMAGE}"

      - name: Use local image in Kubernetes
        if: ${{ matrix.e2e }}
        run: |
          set -Eeuxo pipefail
          find . \( -name "statefulset.yaml" -o -name "pod.yaml" \) -type f -exec \
            sed -i'' 's/imagePullPolicy: Always/imagePullPolicy: IfNotPresent/g' {} +

      - name: Build browser tests image
        if: ${{ matrix.browser }}
        id: browser-tests-image
        run: |
          set -Eeuxo pipefail
          IMAGE="localhost/workbench-images-tests:ci"
          PLAYWRIGHT_VERSION="$(uv run python scripts/get_playwright_version.py tests/browser/package.json5)"
          podman build \
            --build-arg "PLAYWRIGHT_VERSION=${PLAYWRIGHT_VERSION}" \
            -t "${IMAGE}" \
            -f tests/browser/Dockerfile \
            tests/browser
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Provision Kubernetes
        if: ${{ matrix.openshift || matrix.e2e }}
        uses: ./.github/actions/provision-k8s

      - name: Copy Kubernetes configs
        if: ${{ matrix.openshift || matrix.e2e }}
        run: |
          set -Eeuxo pipefail
          cp "$HOME/.kube/config" "$RUNNER_TEMP/kubeconfig-openshift"
          cp "$HOME/.kube/config" "$RUNNER_TEMP/kubeconfig-e2e"

      - name: Start parallel tests
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          PLATFORM: ${{ matrix.platform }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          PODMAN_SOCK: /var/run/podman/podman.sock
        run: |
          set -Eeuxo pipefail

          test_dir="${RUNNER_TEMP}/post-build-tests"
          mkdir -p "${test_dir}"
          mkdir -p "$(dirname "${RUNNER_TEMP}/junit-container-${PLATFORM}.xml")"
          mkdir -p "$(dirname "${RUNNER_TEMP}/junit-openshift-${PLATFORM}.xml")"

          start_test() {
            local name="$1"
            shift
            nohup ci/cached-builds/run_post_build_test.sh "${name}" "$@" \
              >"${test_dir}/${name}.log" 2>&1 &
            echo $! >"${test_dir}/${name}.pid"
          }

          if [[ "${{ matrix.container }}" == "true" ]]; then
            start_test container env \
              IMAGE="${IMAGE}" \
              PLATFORM="${PLATFORM}" \
              DOCKER_HOST="unix://${PODMAN_SOCK}" \
              TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE="${PODMAN_SOCK}" \
              TESTCONTAINERS_RYUK_DISABLED=true \
              FORCE_COLOR=1 \
              JUNIT_XML="${RUNNER_TEMP}/junit-container-${PLATFORM}.xml" \
              uv run pytest --capture=fd tests/containers \
                -m 'not openshift and not cuda and not rocm and not manifest_validation' \
                --image="${IMAGE}" \
                --junitxml="${RUNNER_TEMP}/junit-container-${PLATFORM}.xml" \
                -o junit_family=legacy \
                --log-level=DEBUG \
                -p no:cacheprovider
          fi

          if [[ "${{ matrix.openshift }}" == "true" ]]; then
            start_test openshift env \
              KUBECONFIG="${RUNNER_TEMP}/kubeconfig-openshift" \
              IMAGE="${IMAGE}" \
              PLATFORM="${PLATFORM}" \
              DOCKER_HOST="unix://${PODMAN_SOCK}" \
              TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE="${PODMAN_SOCK}" \
              TESTCONTAINERS_RYUK_DISABLED=true \
              FORCE_COLOR=1 \
              JUNIT_XML="${RUNNER_TEMP}/junit-openshift-${PLATFORM}.xml" \
              uv run pytest --capture=fd tests/containers \
                -m 'openshift and not cuda and not rocm' \
                --image="${IMAGE}" \
                --junitxml="${RUNNER_TEMP}/junit-openshift-${PLATFORM}.xml" \
                -o junit_family=legacy \
                --log-level=DEBUG \
                -p no:cacheprovider
          fi

          if [[ "${{ matrix.e2e }}" == "true" ]]; then
            start_test e2e env \
              KUBECONFIG="${RUNNER_TEMP}/kubeconfig-e2e" \
              IMAGE_REGISTRY=quay.io/opendatahub/odh-workbench-jupyter-minimal-cpu-py312-ubi9 \
              IMAGE_TAG="${IMAGE_TAG}" \
              NOTEBOOK_TAG="${IMAGE_TAG}" \
              PRODUCT=odh \
              python3 ci/cached-builds/make_test.py --target jupyter-minimal-ubi9-python-3.12
          fi

      - name: Run JupyterLab Playwright tests
        if: ${{ matrix.browser }}
        id: browser
        continue-on-error: true
        uses: ./.github/actions/playwright-test
        with:
          test-target: ${{ needs.prepare.outputs.image }}
          playwright-image: ${{ steps.browser-tests-image.outputs.image }}
          podman-socket: /var/run/podman/podman.sock
          upload-report: true
          upload-junit: true
          report-artifact-name: jupyter-minimal-${{ matrix.artifact_name }}-playwright-report
          junit-artifact-file: jupyter-minimal-${{ matrix.artifact_name }}-playwright-junit.xml
          grep-pattern: '@jupyter'

      - name: Wait for parallel tests
        env:
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
        run: |
          set -euo pipefail

          test_dir="${RUNNER_TEMP}/post-build-tests"
          tests=()
          if [[ "${{ matrix.container }}" == "true" ]]; then tests+=(container); fi
          if [[ "${{ matrix.openshift }}" == "true" ]]; then tests+=(openshift); fi
          if [[ "${{ matrix.e2e }}" == "true" ]]; then tests+=(e2e); fi

          if (( ${#tests[@]} == 0 )); then
            echo "::error::No post-build tests were started"
            exit 1
          fi

          failed=0
          for name in "${tests[@]}"; do
            status_file="${test_dir}/${name}.status"
            pid_file="${test_dir}/${name}.pid"
            pid=$(<"${pid_file}")
            while [[ ! -f "${status_file}" ]]; do
              if ! kill -0 "${pid}" 2>/dev/null; then
                echo "::error::${name} test process exited without reporting status"
                cat "${test_dir}/${name}.log"
                failed=1
                break
              fi
              sleep 1
            done

            if [[ -f "${status_file}" ]]; then
              status_code=$(<"${status_file}")
              if (( status_code != 0 )); then
                echo "::error::${name} test failed with exit code ${status_code}"
                cat "${test_dir}/${name}.log"
                failed=1
              else
                echo "${name} test passed"
              fi
            fi
          done

          if [[ "${BROWSER_OUTCOME}" == "failure" ]]; then
            echo "::error::Browser test failed"
            failed=1
          fi

          if (( failed != 0 )); then
            exit 1
          fi

      - name: Upload post-build test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: jupyter-minimal-${{ matrix.artifact_name }}-post-build-tests
          path: |
            ${{ runner.temp }}/junit-container-${{ matrix.platform }}.xml
            ${{ runner.temp }}/junit-openshift-${{ matrix.platform }}.xml
            ${{ runner.temp }}/post-build-tests/*.log
          retention-days: 14
          if-no-files-found: warn
