---
name: Test Install Podman

"on":
  push:
    branches: [main, stable, 'rhoai-*']
    paths:
      - 'ci/cached-builds/**'
      - '.github/actions/install-podman-action/**'
      - '.github/workflows/test-install-podman.yaml'
  pull_request:
    paths:
      - 'ci/cached-builds/**'
      - '.github/actions/install-podman-action/**'
      - '.github/workflows/test-install-podman.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-install:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install Podman
        uses: './.github/actions/install-podman-action'
        with:
          platform: linux/amd64

      - name: Verify Podman overlay mountopt and native diff
        run: |
          set -Eeuxo pipefail

          grep -q 'metacopy=off' /etc/containers/storage.conf
          grep -q 'redirect_dir=off' /etc/containers/storage.conf

          if podman --log-level=debug info 2>&1 | grep -qi 'useNativeDiff=true'; then
            echo "Podman native overlay diff is active"
          else
            echo "podman --log-level=debug info did not report native diff; probing build output" >&2
            probe_dir="$(mktemp -d)"
            trap 'rm -rf "${probe_dir}"' EXIT
            printf '%s\n' 'FROM docker.io/alpine' 'RUN echo native-diff-probe' > "${probe_dir}/Containerfile"
            build_log="$(mktemp)"
            if ! podman --log-level=debug build -t native-diff-probe "${probe_dir}" >"${build_log}" 2>&1; then
              cat "${build_log}"
              exit 1
            fi
            if grep -qi 'Not using native diff for overlay' "${build_log}"; then
              cat "${build_log}"
              echo "Podman is not using native overlay diff" >&2
              exit 1
            fi
            echo "Podman native overlay diff probe passed"
          fi

      - name: Test Podman installation
        run: |
          set -Eeuxo pipefail

          podman version

          # https://github.com/containers/podman/blob/main/docs/tutorials/podman_tutorial.md#running-a-sample-container
          podman run --name basic_httpd -dt -p 8080:80/tcp docker.io/nginx

      - name: Test container networking (IP and DNS)
        run: |
          set -Eeuxo pipefail

          # Well-known IPs — raw L3/L4 reachability without DNS (TCP to public resolvers).
          # Do not use HTTP to 1.1.1.1:80; Cloudflare DNS is not a web server on port 80.
          podman run --rm docker.io/alpine sh -euxc \
            'nc -zvw5 8.8.8.8 53 && nc -zvw5 1.1.1.1 53'

          # Public hostname — exercises container DNS via libc resolver (catches 127.0.0.53 stub leaks).
          # Explicit UDP/TCP resolver checks (catches pasta TCP regressions: podman #23239).
          podman run --rm docker.io/alpine sh -euxc '
            apk add --no-cache bind-tools ca-certificates >/dev/null
            wget -q -O /dev/null -T 15 http://example.com/
            wget -q -O /dev/null -T 15 https://github.com/
            dig @8.8.8.8 +short example.com | grep -q .
            dig @8.8.8.8 +tcp +short example.com | grep -q .
            dig @8.8.8.8 +short github.com | grep -q .
            dig @8.8.8.8 +tcp +short github.com | grep -q .
          '

          echo "Container IP and DNS reachability OK"
