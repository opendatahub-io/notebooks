---
name: Dispatch Jupyter Minimal Konflux tests

on:  # yamllint disable-line rule:truthy
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      commit_sha:
        description: Pull request head commit SHA
        required: true
        type: string

concurrency:
  group: konflux-jupyter-minimal-test-dispatch-${{ github.event.check_run.check_suite.head_sha || github.event.inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  dispatch-tests:
    if: >-
      github.repository == 'opendatahub-io/notebooks' && (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.check_run.name == 'Red Hat Konflux / odh-workbench-jupyter-minimal-cpu-py312-ubi9-on-pull-request' &&
          github.event.check_run.conclusion == 'success'
        )
      )
    permissions:
      pull-requests: write
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Dispatch post-build test lanes
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.check_run.check_suite.head_sha || github.event.inputs.commit_sha }}
          PR_NUMBER: ${{ github.event.check_run.check_suite.pull_requests[0].number || github.event.inputs.pr_number }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::GH_ACCESS_TOKEN is not configured"
            exit 1
          fi

          if [[ -z "${PR_NUMBER}" ]]; then
            PR_NUMBER="$(
              gh api "repos/${REPO}/commits/${COMMIT_SHA}/pulls" \
                --jq '[.[] | select(.state == "open")][0].number'
            )"
          fi

          head_sha="$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json headRefOid --jq '.headRefOid')"
          if [[ "${head_sha}" != "${COMMIT_SHA}" ]]; then
            echo "Build was for ${COMMIT_SHA}; PR head is ${head_sha}. Skipping stale dispatch."
            exit 0
          fi

          dispatch_lane() {
            local lane="$1"
            local command="$2"
            local marker="konflux-jupyter-minimal-${lane}-${COMMIT_SHA}"

            if gh api "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" --paginate \
              --jq '.[].body' | grep -Fq "<!-- ${marker} -->"; then
              echo "${lane} tests were already dispatched for ${COMMIT_SHA}"
              return
            fi

            gh pr comment "${PR_NUMBER}" --repo "${REPO}" \
              --body "$(printf '%s\n<!-- %s -->' "${command}" "${marker}")"
            sleep 2
          }

          dispatch_lane functional /test-jupyter-minimal
          dispatch_lane container /test-jupyter-minimal-container
          dispatch_lane browser /test-jupyter-minimal-browser
          dispatch_lane e2e /test-jupyter-minimal-e2e
