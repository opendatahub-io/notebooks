---
name: Validation of software versions referenced in ImageStream manifests
on:  # yamllint disable-line rule:truthy
  push:
    branches: [main, stable, 'rhoai-*']
    # We use a YAML anchor (&trigger_paths) and alias (*trigger_paths) to deduplicate paths.
    # Docs: https://yaml.org/spec/1.2.2/#3222-anchors-and-aliases
    # Tutorial & Gotchas: https://frenck.dev/github-actions-yaml-anchors-aliases-merge-keys/
    paths: &trigger_paths
      - '.github/workflows/software-versions.yaml'
      - '.github/actions/apt-install/**'
      - '.github/actions/setup-uv/**'
      - 'manifests/odh/base/params.env'
      - 'manifests/odh/base/*-imagestream.yaml'
      - 'manifests/rhoai/base/params.env'
      - 'manifests/rhoai/base/*-imagestream.yaml'
      - 'pytest.ini'
      - 'tests/containers/manifest_validation_test.py'
  pull_request:
    paths: *trigger_paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validation-of-sw-versions-in-imagestreams:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: skopeo
          update: 'false'

      - name: Setup uv and Python
        uses: ./.github/actions/setup-uv

      - name: Unlock git-crypt and configure registry auth
        uses: ./.github/actions/git-crypt-auth
        with:
          git-crypt-key: ${{ secrets.GIT_CRYPT_KEY }}

      - name: Configure Docker auth for podman
        run: |
          mkdir -p "$HOME/.docker"
          cp ci/secrets/pull-secret.json "$HOME/.docker/config.json"

      - name: Configure Quay.io API auth for RHOAI namespace
        if: env.RHOAI_QUAY_BOT_USERNAME != ''
        run: |
          QUAY_AUTH=$(echo -n "${RHOAI_QUAY_BOT_USERNAME}:${RHOAI_QUAY_BOT_PASSWORD}" | base64 -w 0)
          echo "::add-mask::$QUAY_AUTH"
          echo "QUAY_AUTH=$QUAY_AUTH" >> "$GITHUB_ENV"
          printf '%s' "${RHOAI_QUAY_BOT_PASSWORD}" | skopeo login --username "${RHOAI_QUAY_BOT_USERNAME}" --password-stdin quay.io
        env:
          RHOAI_QUAY_BOT_USERNAME: ${{ secrets.RHOAI_QUAY_BOT_USERNAME }}
          RHOAI_QUAY_BOT_PASSWORD: ${{ secrets.RHOAI_QUAY_BOT_PASSWORD }}

      - name: Validate manifest annotations against Quay.io Clair scan
        run: |
          uv run pytest tests/containers/manifest_validation_test.py::test_old_tag_annotations_match_quay -v
