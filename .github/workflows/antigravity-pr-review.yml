---
name: '🔎 Antigravity Pull Request Review'

"on":
  workflow_call:
    inputs:
      pull_request_number:
        type: 'string'
        description: 'Pull request number to review'
        required: true
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false
    secrets:
      GEMINI_API_KEY:
        required: true
      APP_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: 'Pull request number to review'
        required: true
        type: 'string'
      additional_context:
        description: 'Any additional context from the request'
        required: false
        type: 'string'

concurrency:
  group: '${{ github.workflow }}-review-${{ inputs.pull_request_number || github.event.inputs.pull_request_number }}'
  cancel-in-progress: true

jobs:
  review:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    permissions:
      contents: 'read'
      issues: 'write'
      packages: 'read'
      pull-requests: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1'  # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Setup uv and Python'
        uses: './.github/actions/setup-uv'

      - name: 'Install from uv.lock (project + dev deps)'
        run: 'uv sync --locked --package odh-ci-agent'

      # odh-ci-prepare-review-context pulls the buildinputs image to resolve affected image targets.
      - name: 'Login to GitHub Container Registry'
        uses: 'docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0'  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Validate pull request number'
        id: 'validate_pr'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER_RAW: ${{ inputs.pull_request_number || github.event.inputs.pull_request_number }}
        uses: 'actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3'  # v9.0.0
        with:
          github-token: ${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}
          script: |-
            const raw = process.env.PR_NUMBER_RAW || '';
            if (!/^[1-9][0-9]*$/.test(raw)) {
              throw new Error(`Invalid pull request number: ${raw}`);
            }
            const prNumber = Number(raw);
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            core.setOutput('pull_request_number', String(prNumber));

      - name: 'Prepare review context'
        env:
          ADDITIONAL_CONTEXT: ${{ inputs.additional_context || github.event.inputs.additional_context }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}
          PULL_REQUEST_NUMBER: ${{ steps.validate_pr.outputs.pull_request_number }}
          REVIEW_CONTEXT_PATH: 'review-context.json'
        run: 'uv run --package odh-ci-agent odh-ci-prepare-review-context'

      - name: 'Run Antigravity pull request review'
        env:
          ADDITIONAL_CONTEXT: ${{ inputs.additional_context || github.event.inputs.additional_context }}
          AGY_RUN_STATISTICS_PATH: 'agy-run-statistics.json'
          AGY_TRAJECTORY_DIR: 'agy-trajectory/pr-review'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}
          PULL_REQUEST_NUMBER: ${{ steps.validate_pr.outputs.pull_request_number }}
          REVIEW_BODY_PATH: 'review-summary-body.md'
          REVIEW_CONTEXT_PATH: 'review-context.json'
        run: 'uv run --package odh-ci-agent odh-ci-review-pr'

      - name: 'Upload Antigravity run statistics'
        if: |-
          always() && hashFiles('agy-run-statistics.json') != ''
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'  # v7.0.1
        with:
          name: 'antigravity-run-statistics-${{ github.run_id }}'
          path: 'agy-run-statistics.json'
          if-no-files-found: 'warn'

      - name: 'Upload Antigravity run trajectory'
        if: |-
          always() && hashFiles('agy-trajectory/pr-review/**') != ''
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'  # v7.0.1
        with:
          name: 'antigravity-pr-review-${{ github.run_id }}'
          path: 'agy-trajectory/pr-review/'
          if-no-files-found: 'error'

      - name: 'Upsert review summary comment'
        env:
          GITHUB_APP_SLUG: ${{ steps.mint_identity_token.outputs.app-slug }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}
          PULL_REQUEST_NUMBER: ${{ steps.validate_pr.outputs.pull_request_number }}
          REVIEW_AUTHOR_LOGIN: ${{ steps.mint_identity_token.outputs.app-slug != '' && format('{0}[bot]', steps.mint_identity_token.outputs.app-slug) || 'github-actions[bot]' }}
          REVIEW_BODY_PATH: 'review-summary-body.md'
          WORKFLOW_RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        run: 'uv run --package odh-ci-agent odh-ci-upsert-review-comment'

      - name: 'Post review failure comment'
        if: |-
          ${{ failure() }}
        env:
          PR_NUMBER: ${{ steps.validate_pr.outputs.pull_request_number }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        uses: 'actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3'  # v9.0.0
        with:
          github-token: ${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}
          script: |-
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              throw new Error(`Invalid pull request number: ${process.env.PR_NUMBER}`);
            }
            const [owner, repo] = process.env.REPOSITORY.split('/');
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: `There was a problem with the Antigravity PR review. Please check the [workflow logs](${process.env.SERVER_URL}/${process.env.REPOSITORY}/actions/runs/${process.env.RUN_ID}) for details.`,
            })
