---
# Regenerate rpms.lock.yaml from rpms.in.yaml for ODH and RHDS in parallel.
name: RPM Lock Files Renewal Action

permissions: {}  # least-privilege; grant per-job below

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "0 1 * * *"  # Daily RPM lockfile update (1am UTC)
  workflow_dispatch:
    inputs:
      variant:
        description: 'Which RPM lockfile variant to regenerate'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'odh'
          - 'rhds'
      branch:
        description: 'Branch to update'
        required: false
        default: 'main'
      use_cache:
        description: 'Use GHCR layer cache (Uncheck to rebuild from scratch)'
        required: false
        default: true
        type: boolean

concurrency:
  group: rpms-lockfile-renewal-${{ github.event.inputs.branch || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    outputs:
      variants: ${{ steps.inputs.outputs.variants }}
      base-sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Validate inputs
        id: inputs
        env:
          VARIANT: ${{ github.event.inputs.variant || 'both' }}
        run: |
          case "${VARIANT}" in
            both) variants='["odh","rhds"]' ;;
            odh|rhds) variants="[\"${VARIANT}\"]" ;;
            *) echo "VARIANT must be one of: both, odh, rhds" >&2; exit 1 ;;
          esac
          echo "variants=${variants}" >> "${GITHUB_OUTPUT}"

      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve base SHA
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  generate:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.prepare.outputs.variants) }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    env:
      BRANCH: ${{ github.event.inputs.branch || 'main' }}
      BASE_SHA: ${{ needs.prepare.outputs.base-sha }}
      VARIANT: ${{ matrix.variant }}
      TMPDIR: /var/tmp
      CI: "true"
      USE_CACHE: ${{ github.event.inputs.use_cache != 'false' && 'true' || 'false' }}

    steps:
      - name: Checkout base SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"

      - name: Setup uv and Python
        uses: ./.github/actions/setup-uv

      - name: Prepare Podman temp directory
        run: mkdir -p "$TMPDIR"

      - name: Unlock git-crypt and configure registry auth
        if: matrix.variant == 'rhds'
        uses: ./.github/actions/git-crypt-auth
        with:
          git-crypt-key: ${{ secrets.GIT_CRYPT_KEY }}

      - name: Mask subscription credentials
        if: matrix.variant == 'rhds'
        env:
          SUBSCRIPTION_ACTIVATION_KEY: ${{ secrets.SUBSCRIPTION_ACTIVATION_KEY }}
          SUBSCRIPTION_ORG: ${{ secrets.SUBSCRIPTION_ORG }}
        run: |
          if [[ -z "$SUBSCRIPTION_ACTIVATION_KEY" || -z "$SUBSCRIPTION_ORG" ]]; then
            echo "RHDS requires subscription secrets." >&2
            exit 1
          fi
          echo "::add-mask::${SUBSCRIPTION_ACTIVATION_KEY}"
          echo "::add-mask::${SUBSCRIPTION_ORG}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Podman
        uses: ./.github/actions/install-podman-action
        with:
          platform: linux/amd64

      - name: Compute container build cache args
        id: cache
        env:
          CACHE: ghcr.io/${{ github.repository }}/rpm-lockfile-build-cache-${{ matrix.variant }}
          USE_CACHE: ${{ env.USE_CACHE }}
          VARIANT: ${{ matrix.variant }}
        run: |
          cache="${CACHE,,}"
          if [[ "$USE_CACHE" == "true" ]]; then
            if [[ "$VARIANT" == "rhds" ]]; then
              echo "CONTAINER_BUILD_CACHE_ARGS=--cache-from ${cache}" >> "$GITHUB_OUTPUT"
            else
              echo "CONTAINER_BUILD_CACHE_ARGS=--cache-from ${cache} --cache-to ${cache}" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$VARIANT" == "odh" ]]; then
            echo "CONTAINER_BUILD_CACHE_ARGS=--cache-to ${cache}" >> "$GITHUB_OUTPUT"
          else
            echo "CONTAINER_BUILD_CACHE_ARGS=" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate lockfiles
        env:
          SUBSCRIPTION_ACTIVATION_KEY: ${{ matrix.variant == 'rhds' && secrets.SUBSCRIPTION_ACTIVATION_KEY || '' }}
          SUBSCRIPTION_ORG: ${{ matrix.variant == 'rhds' && secrets.SUBSCRIPTION_ORG || '' }}
          CONTAINER_BUILD_CACHE_ARGS: ${{ steps.cache.outputs.CONTAINER_BUILD_CACHE_ARGS }}
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "$VARIANT" == "odh" ]]; then
            unset SUBSCRIPTION_ACTIVATION_KEY SUBSCRIPTION_ORG || true
          fi

          temp_branch="rpm-lockfile-${VARIANT}-${BRANCH//\//-}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$temp_branch" "$BASE_SHA"

          rpm_inputs=(
            "prefetch-input/${VARIANT}/rpms.in.yaml"
            "codeserver/ubi9-python-3.12/prefetch-input/${VARIANT}/rpms.in.yaml"
            "codeserver-baseline/ubi9-python-3.12/prefetch-input/${VARIANT}/rpms.in.yaml"
          )
          for rpm_input in "${rpm_inputs[@]}"; do
            if [[ ! -f "$rpm_input" ]]; then
              echo "Skipping missing input: $rpm_input"
              continue
            fi
            ./scripts/lockfile-generators/create-rpm-lockfile.sh --rpm-input "$rpm_input"
          done

          for lockfile in \
            "prefetch-input/${VARIANT}/rpms.lock.yaml" \
            "codeserver/ubi9-python-3.12/prefetch-input/${VARIANT}/rpms.lock.yaml" \
            "codeserver-baseline/ubi9-python-3.12/prefetch-input/${VARIANT}/rpms.lock.yaml"; do
            if [[ -f "$lockfile" ]]; then
              git add "$lockfile"
            fi
          done

          if git diff --cached --quiet; then
            echo "No ${VARIANT} RPM lockfile changes."
          else
            variant_upper="${VARIANT^^}"
            git commit -m "Update ${variant_upper} rpms.lock.yaml lock files"
          fi

          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push "$remote_url" "HEAD:refs/heads/${temp_branch}"

  finalize:
    needs: [prepare, generate]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    env:
      BRANCH: ${{ github.event.inputs.branch || 'main' }}
      BASE_SHA: ${{ needs.prepare.outputs.base-sha }}
      VARIANTS: ${{ needs.prepare.outputs.variants }}
      TMPDIR: /var/tmp
      CI: "true"

    steps:
      - name: Checkout base SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"

      - name: Setup uv and Python
        uses: ./.github/actions/setup-uv

      - name: Merge variant branches
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          renewal_branch="rpms-lockfile-renewal-${{ github.event.inputs.variant || 'both' }}-${BRANCH//\//-}"
          git checkout -B "$renewal_branch" "$BASE_SHA"

          for variant in $(jq -r '.[]' <<<"$VARIANTS"); do
            temp_branch="rpm-lockfile-${variant}-${BRANCH//\//-}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git fetch "$remote_url" "+refs/heads/${temp_branch}:refs/remotes/origin/${temp_branch}"
            commit_count="$(git rev-list --count "${BASE_SHA}..refs/remotes/origin/${temp_branch}")"
            if [[ "$commit_count" -gt 0 ]]; then
              git cherry-pick "${BASE_SHA}..refs/remotes/origin/${temp_branch}"
            fi
          done

          changed="$(git rev-list --count "${BASE_SHA}..HEAD")"
          echo "changed=${changed}" >> "$GITHUB_ENV"

      - name: Validate manifests
        if: env.changed != '0'
        run: env -u VARIANT make test

      - name: Create Pull Request
        if: env.changed != '0'
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          renewal_branch="rpms-lockfile-renewal-${{ github.event.inputs.variant || 'both' }}-${BRANCH//\//-}"
          remote_branch_sha="$(git ls-remote "$remote_url" "refs/heads/${renewal_branch}" | awk '{print $1}')"
          if [[ -z "$remote_branch_sha" ]]; then
            git push -u "$remote_url" "$renewal_branch"
          else
            git push --force-with-lease="${renewal_branch}:${remote_branch_sha}" -u "$remote_url" "$renewal_branch"
          fi

          gh label create "automated-rpms-lockfile-update" \
            --description "Auto-created RPM lockfile update PR" \
            --color "0E8A16" \
            2>/dev/null || true

          existing_pr_url="$(gh pr list --head "$renewal_branch" --state open --limit 1 --json url --jq '.[0].url // empty')"
          if [[ -n "$existing_pr_url" ]]; then
            PR_URL="$existing_pr_url"
          else
            VARIANT_UPPER="$(echo '${{ github.event.inputs.variant || 'both' }}' | tr '[:lower:]' '[:upper:]')"
            PR_URL="$(gh pr create \
              --title "GHA: Update RPM lock files (${VARIANT_UPPER})" \
              --head "$renewal_branch" \
              --body "$(cat <<EOF
          Automated regeneration of \`rpms.lock.yaml\` from \`rpms.in.yaml\`.

          Updated paths:
          - \`prefetch-input/{odh,rhds}/rpms.lock.yaml\`
          - \`codeserver/ubi9-python-3.12/prefetch-input/{odh,rhds}/rpms.lock.yaml\`
          - \`codeserver-baseline/ubi9-python-3.12/prefetch-input/{odh,rhds}/rpms.lock.yaml\`

          PR CI runs independently after this workflow finishes; Tide handles merging once
          repository requirements pass.
          EOF
          )" \
              --label "automated-rpms-lockfile-update" \
              --base "$BRANCH")"
          fi
          echo "PR_URL=${PR_URL}" >> "$GITHUB_ENV"

      - name: Approve renewal PR
        if: env.PR_URL != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr review "${PR_URL}" --approve --body "Auto-approved after RPM renewal workflow validation."

      - name: Enable auto-merge
        if: env.PR_URL != ''
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: gh pr merge "${PR_URL}" --merge --auto --delete-branch
