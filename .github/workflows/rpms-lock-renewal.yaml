---
# Regenerate rpms.lock.yaml from rpms.in.yaml for ODH (upstream) and RHDS (downstream).
name: RPM Lock Files Renewal Action

permissions: {}  # default-deny: unscoped jobs get only metadata:read

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "0 1 * * *"  # Daily RPM lockfile update (1am UTC)
  workflow_dispatch:
    inputs:
      variant:
        description: 'Which RPM lockfile variant to regenerate'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'odh'
          - 'rhds'
      branch:
        description: 'Branch to update'
        required: false
        default: 'main'
      use_cache:
        description: 'Use GHCR layer cache (Uncheck to rebuild from scratch)'
        required: false
        default: true
        type: boolean

jobs:
  refresh-rpm-lock-files:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    concurrency:
      group: refresh-rpm-lock-files-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read  # checkout only; push and PR creation use the PAT
      packages: write  # push/pull rpm-lockfile build cache to ghcr.io
    env:
      BRANCH: ${{ github.event.inputs.branch || 'main' }}
      VARIANT: ${{ github.event.inputs.variant || 'both' }}
      TMPDIR: /var/tmp
      CI: "true"
      USE_CACHE: ${{ github.event.inputs.use_cache != 'false' && 'true' || 'false' }}

    steps:
      - name: Validate inputs
        run: |
          case "${VARIANT}" in
            both|odh|rhds) ;;
            *) echo "VARIANT must be one of: both, odh, rhds" >&2; exit 1 ;;
          esac

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.BRANCH }}
          persist-credentials: false
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"

      - name: Create renewal branch
        run: |
          RENEWAL_BRANCH="rpms-lockfile-renewal-${VARIANT}-${BRANCH//\//-}"
          git checkout -B "$RENEWAL_BRANCH" "$BRANCH"
          echo "RENEWAL_BRANCH=$RENEWAL_BRANCH" >> "${GITHUB_ENV}"

      - name: Setup uv and Python
        uses: ./.github/actions/setup-uv

      - name: Prepare Podman temp directory
        run: mkdir -p "$TMPDIR"

      # RHDS secrets and registry auth must be configured before Install Podman.
      # install-podman-action runs `sudo podman system reset`, which can leave
      # root-owned files under $HOME/.config/containers and break a later cp.
      - name: Unlock git-crypt and configure registry auth
        if: env.VARIANT == 'both' || env.VARIANT == 'rhds'
        uses: ./.github/actions/git-crypt-auth
        with:
          git-crypt-key: ${{ secrets.GIT_CRYPT_KEY }}

      - name: Mask subscription credentials
        if: env.VARIANT == 'both' || env.VARIANT == 'rhds'
        env:
          SUBSCRIPTION_ACTIVATION_KEY: ${{ secrets.SUBSCRIPTION_ACTIVATION_KEY }}
          SUBSCRIPTION_ORG: ${{ secrets.SUBSCRIPTION_ORG }}
        run: |
          # Mask before any podman build/run so activation key never appears in logs.
          # Secrets are passed only via env vars (never CLI args); see prefetch-all.sh.
          if [[ -z "$SUBSCRIPTION_ACTIVATION_KEY" || -z "$SUBSCRIPTION_ORG" ]]; then
            echo "RHDS variant requires SUBSCRIPTION_ACTIVATION_KEY and SUBSCRIPTION_ORG repository secrets." >&2
            exit 1
          fi
          echo "::add-mask::${SUBSCRIPTION_ACTIVATION_KEY}"
          echo "::add-mask::${SUBSCRIPTION_ORG}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Podman
        uses: ./.github/actions/install-podman-action
        with:
          platform: linux/amd64

      - name: Regenerate rpms.lock.yaml
        id: regenerate-rpm-lock-files
        env:
          SUBSCRIPTION_ACTIVATION_KEY: ${{ secrets.SUBSCRIPTION_ACTIVATION_KEY }}
          SUBSCRIPTION_ORG: ${{ secrets.SUBSCRIPTION_ORG }}
        run: |
          set -euo pipefail

          case "${VARIANT}" in
            both) variants=(odh rhds) ;;
            *) variants=("${VARIANT}") ;;
          esac

          for variant in "${variants[@]}"; do
            echo "=== Regenerating RPM lockfiles for ${variant} (USE_CACHE=${USE_CACHE}) ==="

            cache="ghcr.io/${{ github.repository }}/rpm-lockfile-build-cache-${variant}"
            cache="${cache,,}"
            if [[ "$USE_CACHE" == "true" ]]; then
              if [[ "$variant" == "rhds" ]]; then
                # RHDS builds register with subscription-manager; do not push layers to GHCR.
                export CONTAINER_BUILD_CACHE_ARGS="--cache-from ${cache}"
              else
                export CONTAINER_BUILD_CACHE_ARGS="--cache-from ${cache} --cache-to ${cache}"
              fi
            elif [[ "$variant" == "odh" ]]; then
              export CONTAINER_BUILD_CACHE_ARGS="--cache-to ${cache}"
            else
              export CONTAINER_BUILD_CACHE_ARGS=""
            fi

            if [[ "$variant" == "rhds" ]]; then
              # ODH leaves a CentOS-based lockfile image; RHDS must rebuild with subscription.
              podman rmi -f localhost/notebook-rpm-lockfile:latest 2>/dev/null || true
            elif [[ "$USE_CACHE" == "false" ]]; then
              podman rmi -f localhost/notebook-rpm-lockfile:latest 2>/dev/null || true
            fi

            rpm_inputs=(
              "prefetch-input/${variant}/rpms.in.yaml"
              "codeserver/ubi9-python-3.12/prefetch-input/${variant}/rpms.in.yaml"
              "codeserver-baseline/ubi9-python-3.12/prefetch-input/${variant}/rpms.in.yaml"
            )
            for rpm_input in "${rpm_inputs[@]}"; do
              if [[ ! -f "$rpm_input" ]]; then
                echo "Skipping missing input: $rpm_input"
                continue
              fi
              if [[ "$variant" == "odh" ]]; then
                # ODH must not see subscription credentials; create-rpm-lockfile.sh would switch to UBI9.
                env -u SUBSCRIPTION_ACTIVATION_KEY -u SUBSCRIPTION_ORG \
                  ./scripts/lockfile-generators/create-rpm-lockfile.sh --rpm-input "$rpm_input"
              else
                ./scripts/lockfile-generators/create-rpm-lockfile.sh --rpm-input "$rpm_input"
              fi
            done

            for lockfile in \
              "prefetch-input/${variant}/rpms.lock.yaml" \
              "codeserver/ubi9-python-3.12/prefetch-input/${variant}/rpms.lock.yaml" \
              "codeserver-baseline/ubi9-python-3.12/prefetch-input/${variant}/rpms.lock.yaml"; do
              if [[ -f "$lockfile" ]]; then
                git add "$lockfile"
              fi
            done

            if git diff --cached --quiet; then
              echo "No ${variant} RPM lockfile changes to commit."
              continue
            fi

            variant_upper="${variant^^}"
            git commit -m "Update ${variant_upper} rpms.lock.yaml lock files"
          done

          if [[ "$(git rev-list --count "${BRANCH}..HEAD")" -eq 0 ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate manifests (make test)
        if: steps.regenerate-rpm-lock-files.outputs.changed == 'true'
        run: env -u VARIANT make test

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "$(git rev-list --count "${BRANCH}..HEAD" 2>/dev/null || echo 0)" -eq 0 ]]; then
            echo "No RPM lockfile changes. Skipping PR creation."
            exit 0
          fi

          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          remote_branch_sha=$(git ls-remote "$remote_url" "refs/heads/${RENEWAL_BRANCH}" | awk '{print $1}')
          if [[ -z "$remote_branch_sha" ]]; then
            git push -u "$remote_url" "$RENEWAL_BRANCH"
          else
            git push --force-with-lease="${RENEWAL_BRANCH}:${remote_branch_sha}" -u "$remote_url" "$RENEWAL_BRANCH"
          fi

          # gh pr create fails if the label does not exist yet (see automated-lockfile-update).
          gh label create "automated-rpms-lockfile-update" \
            --description "Auto-created RPM lockfile update PR" \
            --color "0E8A16" \
            2>/dev/null || true

          existing_pr_url=$(gh pr list --head "$RENEWAL_BRANCH" --state open --limit 1 --json url --jq '.[0].url // empty')
          if [[ -n "$existing_pr_url" ]]; then
            echo "Updating existing RPM lockfile renewal PR: $existing_pr_url"
            exit 0
          fi

          VARIANT_UPPER=$(echo "$VARIANT" | tr '[:lower:]' '[:upper:]')
          BRANCH_NAME="$RENEWAL_BRANCH"
          gh pr create \
            --title "GHA: Update RPM lock files (${VARIANT_UPPER})" \
            --head "$BRANCH_NAME" \
            --body "$(cat <<EOF
          Automated regeneration of \`rpms.lock.yaml\` from \`rpms.in.yaml\`.

          Updated paths:
          - \`prefetch-input/{odh,rhds}/rpms.lock.yaml\`
          - \`codeserver/ubi9-python-3.12/prefetch-input/{odh,rhds}/rpms.lock.yaml\`
          - \`codeserver-baseline/ubi9-python-3.12/prefetch-input/{odh,rhds}/rpms.lock.yaml\`

          PR CI runs independently after this workflow finishes; Tide handles merging once
          repository requirements pass.
          EOF
          )" \
            --label "automated-rpms-lockfile-update" \
            --base "$BRANCH"
