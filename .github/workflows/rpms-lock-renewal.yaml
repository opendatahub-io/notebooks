---
# Regenerate RPM lock files for ODH and downstream RHDS release branches.
name: RPM Lock Files Renewal Action

permissions: {}  # least-privilege; grant per-job below

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "0 1 * * *"  # Daily RPM lockfile update (1am UTC)
  workflow_dispatch:
    inputs:
      variant:
        description: 'Which RPM lockfile variant to regenerate'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'odh'
          - 'rhds'
      branch:
        description: 'Branch to update (release branches are downstream-only)'
        required: false
        default: 'main'
        type: choice
        options:
          - 'main'
          - 'rhoai-2.25'
          - 'rhoai-3.4'
          - 'rhoai-3.5'
          - 'rhoai-3.6'
      use_cache:
        description: 'Use GHCR layer cache (Uncheck to rebuild from scratch)'
        required: false
        default: true
        type: boolean

concurrency:
  group: rpms-lockfile-renewal-${{ github.event_name }}-${{ github.event.inputs.branch || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.inputs.outputs.matrix }}
      branches: ${{ steps.inputs.outputs.branches }}
      variants: ${{ steps.inputs.outputs.variants }}
      variant-count: ${{ steps.inputs.outputs.variant-count }}
    steps:
      - name: Validate inputs and build matrix
        id: inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
          INPUT_VARIANT: ${{ github.event.inputs.variant }}
        run: |
          set -euo pipefail

          case "${REPOSITORY}" in
            opendatahub-io/notebooks)
              is_downstream=false
              allowed_branches=(main)
              ;;
            red-hat-data-services/notebooks)
              is_downstream=true
              allowed_branches=(rhoai-2.25 rhoai-3.4 rhoai-3.5 rhoai-3.6)
              ;;
            *)
              echo "This workflow only supports opendatahub-io/notebooks and red-hat-data-services/notebooks." >&2
              exit 1
              ;;
          esac

          branch="${INPUT_BRANCH:-main}"
          if ! printf '%s\n' "${allowed_branches[@]}" | grep -Fxq "$branch"; then
            echo "Branch ${branch} is not valid for ${REPOSITORY}." >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            if [[ "$is_downstream" == "true" ]]; then
              branches=(rhoai-2.25 rhoai-3.4 rhoai-3.5 rhoai-3.6)
              variant='rhds'
            else
              branches=(main)
              variant='both'
            fi
          else
            branches=("$branch")
            if [[ "$is_downstream" == "true" ]]; then
              variant='rhds'
            else
              variant="${INPUT_VARIANT:-both}"
            fi
          fi

          case "$variant" in
            both) variants=(odh rhds) ;;
            odh|rhds) variants=("$variant") ;;
            *) echo "VARIANT must be one of: both, odh, rhds" >&2; exit 1 ;;
          esac

          branches_json="$(printf '%s\n' "${branches[@]}" | jq -Rsc 'split("\n")[:-1]')"
          variants_json="$(printf '%s\n' "${variants[@]}" | jq -Rsc 'split("\n")[:-1]')"
          matrix_json="$(jq -nc \
            --argjson branches "$branches_json" \
            --argjson variants "$variants_json" \
            '{include: ([$branches[] as $branch | $variants[] as $variant | {branch: $branch, variant: $variant}])}')"

          echo "matrix=${matrix_json}" >> "$GITHUB_OUTPUT"
          echo "branches=${branches_json}" >> "$GITHUB_OUTPUT"
          echo "variants=${variants_json}" >> "$GITHUB_OUTPUT"
          echo "variant-count=${#variants[@]}" >> "$GITHUB_OUTPUT"

  generate:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      issues: write
      pull-requests: write
    env:
      BRANCH: ${{ matrix.branch }}
      VARIANT: ${{ matrix.variant }}
      VARIANT_COUNT: ${{ needs.prepare.outputs.variant-count }}
      TMPDIR: /var/tmp
      CI: "true"
      USE_CACHE: ${{ github.event.inputs.use_cache != 'false' && 'true' || 'false' }}

    steps:
      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.BRANCH }}
          persist-credentials: false
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"

      - name: Setup uv and Python
        uses: ./.github/actions/setup-uv

      - name: Prepare Podman temp directory
        run: mkdir -p "$TMPDIR"

      - name: Install git-crypt
        if: matrix.variant == 'rhds' && matrix.branch != 'rhoai-2.25'
        uses: ./.github/actions/apt-install
        with:
          packages: git-crypt

      - name: Unlock RHDS registry secrets
        if: matrix.variant == 'rhds' && matrix.branch != 'rhoai-2.25'
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$GIT_CRYPT_KEY" ]]; then
            echo "RHDS requires GIT_CRYPT_KEY." >&2
            exit 1
          fi
          key_file="$(mktemp "${RUNNER_TEMP}/git-crypt-key.XXXXXX")"
          trap 'rm -f "${key_file}"' EXIT
          printf '%s' "$GIT_CRYPT_KEY" | base64 --decode > "$key_file"
          git-crypt unlock "$key_file"

      - name: Configure RHDS registry authentication
        if: matrix.variant == 'rhds' && matrix.branch != 'rhoai-2.25'
        run: |
          set -euo pipefail
          if [[ ! -f ci/secrets/pull-secret.json ]]; then
            echo "RHDS requires ci/secrets/pull-secret.json." >&2
            exit 1
          fi
          mkdir -p "${HOME}/.config/containers"
          cp ci/secrets/pull-secret.json "${HOME}/.config/containers/auth.json"

      - name: Mask subscription credentials
        if: matrix.variant == 'rhds' && matrix.branch != 'rhoai-2.25'
        env:
          SUBSCRIPTION_ACTIVATION_KEY: ${{ secrets.SUBSCRIPTION_ACTIVATION_KEY }}
          SUBSCRIPTION_ORG: ${{ secrets.SUBSCRIPTION_ORG }}
        run: |
          if [[ -z "$SUBSCRIPTION_ACTIVATION_KEY" || -z "$SUBSCRIPTION_ORG" ]]; then
            echo "RHDS requires subscription secrets." >&2
            exit 1
          fi
          echo "::add-mask::${SUBSCRIPTION_ACTIVATION_KEY}"
          echo "::add-mask::${SUBSCRIPTION_ORG}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Podman
        uses: ./.github/actions/install-podman-action
        with:
          platform: linux/amd64

      - name: Compute container build cache args
        id: cache
        env:
          REPOSITORY: ${{ github.repository }}
          USE_CACHE: ${{ env.USE_CACHE }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          branch_slug="${BRANCH//\//-}"
          branch_slug="${branch_slug//./-}"
          cache="ghcr.io/${REPOSITORY,,}/rpm-lockfile-build-cache-${VARIANT}-${branch_slug}"
          if [[ "$USE_CACHE" == "true" ]]; then
            if [[ "$VARIANT" == "rhds" ]]; then
              echo "CONTAINER_BUILD_CACHE_ARGS=--cache-from ${cache}" >> "$GITHUB_OUTPUT"
            else
              echo "CONTAINER_BUILD_CACHE_ARGS=--cache-from ${cache} --cache-to ${cache}" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$VARIANT" == "odh" ]]; then
            echo "CONTAINER_BUILD_CACHE_ARGS=--cache-to ${cache}" >> "$GITHUB_OUTPUT"
          else
            echo "CONTAINER_BUILD_CACHE_ARGS=" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate lockfiles
        env:
          SUBSCRIPTION_ACTIVATION_KEY: ${{ matrix.variant == 'rhds' && secrets.SUBSCRIPTION_ACTIVATION_KEY || '' }}
          SUBSCRIPTION_ORG: ${{ matrix.variant == 'rhds' && secrets.SUBSCRIPTION_ORG || '' }}
          CONTAINER_BUILD_CACHE_ARGS: ${{ steps.cache.outputs.CONTAINER_BUILD_CACHE_ARGS }}
        run: |
          set -euo pipefail

          if [[ "$VARIANT" == "odh" || "$BRANCH" == "rhoai-2.25" ]]; then
            unset SUBSCRIPTION_ACTIVATION_KEY SUBSCRIPTION_ORG || true
          fi

          mapfile -t rpm_inputs < <(
            find . -type f -path "*/prefetch-input/${VARIANT}/rpms.in.yaml" | sort
          )
          if [[ "${#rpm_inputs[@]}" -eq 0 ]]; then
            echo "No ${VARIANT} RPM lockfile inputs found on ${BRANCH}." >&2
            exit 1
          fi
          for rpm_input in "${rpm_inputs[@]}"; do
            echo "Generating ${rpm_input}"
            ./scripts/lockfile-generators/create-rpm-lockfile.sh --rpm-input "$rpm_input"
          done

          mapfile -t lockfiles < <(
            find . -type f -path "*/prefetch-input/${VARIANT}/rpms.lock.yaml" | sort
          )
          for lockfile in "${lockfiles[@]}"; do
            git add "$lockfile"
          done

          if git diff --cached --quiet; then
            echo "changed=0" >> "$GITHUB_ENV"
          else
            variant_upper="${VARIANT^^}"
            git commit -m "Update ${variant_upper} rpms.lock.yaml lock files"
            echo "changed=1" >> "$GITHUB_ENV"
          fi

      - name: Validate manifests
        if: env.changed != '0' && env.VARIANT_COUNT == '1'
        run: |
          set -euo pipefail
          if [[ "$BRANCH" == "rhoai-3.4" || "$BRANCH" == "rhoai-3.5" ]]; then
            env -u VARIANT PYTEST_ADDOPTS="--ignore=tests/test_pylock_downgrade.py" make test
          else
            env -u VARIANT make test
          fi

      - name: Push variant branch
        if: env.VARIANT_COUNT != '1'
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          temp_branch="rpm-lockfile-${VARIANT}-${BRANCH//\//-}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push "$remote_url" "HEAD:refs/heads/${temp_branch}"

      - name: Update single-variant renewal branch and pull request
        if: env.changed != '0' && env.VARIANT_COUNT == '1'
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          branch_slug="${BRANCH//\//-}"
          canonical_renewal_branch="rpm-lockfile-renewal-${VARIANT}-${branch_slug}"
          legacy_renewal_branch="rpms-lockfile-renewal-${VARIANT}-${branch_slug}"
          legacy_dispatcher_branch=''
          if [[ "$VARIANT" == 'rhds' && "$GITHUB_REPOSITORY" == 'red-hat-data-services/notebooks' ]]; then
            legacy_dispatcher_branch="rhds-rpm-lockfile-renewal-${branch_slug//./-}"
          fi

          gh label create "automated-rpms-lockfile-update" \
            --description "Auto-created RPM lockfile update PR" \
            --color "0E8A16" \
            2>/dev/null || true

          candidate_prs="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base "$BRANCH" \
            --label "automated-rpms-lockfile-update" \
            --state open \
            --limit 100 \
            --json url,headRefName,headRepository,headRepositoryOwner,createdAt)"
          open_prs="$(jq \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg canonical "$canonical_renewal_branch" \
            --arg legacy "$legacy_renewal_branch" \
            --arg legacy_dispatcher "$legacy_dispatcher_branch" \
            '[.[]
              | select(.headRepository.nameWithOwner == $repository)
              | select(
                  .headRefName == $canonical or
                  .headRefName == $legacy or
                  ($legacy_dispatcher != "" and .headRefName == $legacy_dispatcher)
                )
            ]' <<<"$candidate_prs")"
          open_pr_count="$(jq 'length' <<<"$open_prs")"
          if [[ "$open_pr_count" -gt 1 ]]; then
            echo "::warning::Found ${open_pr_count} open RPM renewal PRs for ${BRANCH}; updating the oldest one."
          fi

          existing_pr="$(jq 'sort_by(.createdAt) | .[0] // empty' <<<"$open_prs")"
          if [[ -n "$existing_pr" ]]; then
            head_owner="$(jq -r '.headRepositoryOwner.login // empty' <<<"$existing_pr")"
            head_repository="$(jq -r '.headRepository.nameWithOwner // empty' <<<"$existing_pr")"
            if [[ "$head_owner" != "$GITHUB_REPOSITORY_OWNER" || "$head_repository" != "$GITHUB_REPOSITORY" ]]; then
              echo "Open RPM renewal PR head is not in ${GITHUB_REPOSITORY}." >&2
              exit 1
            fi
            renewal_branch="$(jq -r '.headRefName' <<<"$existing_pr")"
            PR_URL="$(jq -r '.url' <<<"$existing_pr")"
          else
            renewal_branch="$canonical_renewal_branch"
            PR_URL=''
          fi

          remote_branch_sha="$(git ls-remote "$remote_url" "refs/heads/${renewal_branch}" | awk '{print $1}')"
          if [[ -z "$remote_branch_sha" ]]; then
            git push "$remote_url" "HEAD:refs/heads/${renewal_branch}"
          else
            git push --force-with-lease="${renewal_branch}:${remote_branch_sha}" \
              "$remote_url" "HEAD:refs/heads/${renewal_branch}"
          fi

          if [[ -z "$PR_URL" ]]; then
            if [[ "${{ github.repository }}" == "red-hat-data-services/notebooks" ]]; then
              pr_title="GHA: ${BRANCH} - Update RHDS RPM lock files"
            elif [[ "$VARIANT" == "odh" ]]; then
              pr_title="GHA: (ODH) Update RPM lock files"
            else
              pr_title="GHA: (RHDS) Update RPM lock files"
            fi
            PR_URL="$(gh pr create \
              --title "$pr_title" \
              --head "$renewal_branch" \
              --body "Automated regeneration of \`${VARIANT}/rpms.lock.yaml\` from \`rpms.in.yaml\` for **${BRANCH}**. Tide will merge this PR automatically after all reported checks are green." \
              --label "automated-rpms-lockfile-update" \
              --base "$BRANCH")"
          fi
          echo "PR_URL=${PR_URL}" >> "$GITHUB_ENV"

      - name: Approve single-variant renewal PR
        if: env.PR_URL != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review "${PR_URL}" \
            --approve \
            --body "Auto-approved after RPM renewal workflow validation."

      - name: Label single-variant renewal PR
        if: env.PR_URL != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr_number="${PR_URL##*/}"
          gh api --method POST \
            "repos/${{ github.repository }}/issues/${pr_number}/labels" \
            -f 'labels[]=lgtm' \
            -f 'labels[]=approved' \
            --silent

  finalize:
    if: needs.prepare.outputs.variant-count != '1'
    needs: [prepare, generate]
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.prepare.outputs.branches) }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      BRANCH: ${{ matrix.branch }}
      BASE_SHA: ''
      VARIANTS: ${{ needs.prepare.outputs.variants }}
      TMPDIR: /var/tmp
      CI: "true"

    steps:
      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.BRANCH }}
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve base SHA
        run: echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"

      - name: Setup uv and Python
        uses: ./.github/actions/setup-uv

      - name: Merge variant branches
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          branch_slug="${BRANCH//\//-}"
          renewal_branch="rpm-lockfile-renewal-both-${branch_slug}"
          git checkout -B "$renewal_branch" "$BASE_SHA"

          for variant in $(jq -r '.[]' <<<"$VARIANTS"); do
            temp_branch="rpm-lockfile-${variant}-${branch_slug}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git fetch "$remote_url" "+refs/heads/${temp_branch}:refs/remotes/origin/${temp_branch}"
            commit_count="$(git rev-list --count "${BASE_SHA}..refs/remotes/origin/${temp_branch}")"
            if [[ "$commit_count" -gt 0 ]]; then
              git cherry-pick "${BASE_SHA}..refs/remotes/origin/${temp_branch}"
            fi
          done

          changed="$(git rev-list --count "${BASE_SHA}..HEAD")"
          echo "changed=${changed}" >> "$GITHUB_ENV"

      - name: Validate manifests
        if: env.changed != '0'
        run: |
          set -euo pipefail
          if [[ "$BRANCH" == "rhoai-3.4" || "$BRANCH" == "rhoai-3.5" ]]; then
            env -u VARIANT PYTEST_ADDOPTS="--ignore=tests/test_pylock_downgrade.py" make test
          else
            env -u VARIANT make test
          fi

      - name: Update renewal branch and pull request
        if: env.changed != '0'
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          branch_slug="${BRANCH//\//-}"
          canonical_renewal_branch="rpm-lockfile-renewal-both-${branch_slug}"
          legacy_renewal_branch="rpms-lockfile-renewal-both-${branch_slug}"

          gh label create "automated-rpms-lockfile-update" \
            --description "Auto-created RPM lockfile update PR" \
            --color "0E8A16" \
            2>/dev/null || true

          candidate_prs="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base "$BRANCH" \
            --label "automated-rpms-lockfile-update" \
            --state open \
            --limit 100 \
            --json url,headRefName,headRepository,headRepositoryOwner,createdAt)"
          open_prs="$(jq \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg canonical "$canonical_renewal_branch" \
            --arg legacy "$legacy_renewal_branch" \
            '[.[]
              | select(.headRepository.nameWithOwner == $repository)
              | select(.headRefName == $canonical or .headRefName == $legacy)
            ]' <<<"$candidate_prs")"
          open_pr_count="$(jq 'length' <<<"$open_prs")"
          if [[ "$open_pr_count" -gt 1 ]]; then
            echo "::warning::Found ${open_pr_count} open RPM renewal PRs for ${BRANCH}; updating the oldest one."
          fi

          existing_pr="$(jq 'sort_by(.createdAt) | .[0] // empty' <<<"$open_prs")"
          if [[ -n "$existing_pr" ]]; then
            head_owner="$(jq -r '.headRepositoryOwner.login // empty' <<<"$existing_pr")"
            head_repository="$(jq -r '.headRepository.nameWithOwner // empty' <<<"$existing_pr")"
            if [[ "$head_owner" != "$GITHUB_REPOSITORY_OWNER" || "$head_repository" != "$GITHUB_REPOSITORY" ]]; then
              echo "Open RPM renewal PR head is not in ${GITHUB_REPOSITORY}." >&2
              exit 1
            fi
            renewal_branch="$(jq -r '.headRefName' <<<"$existing_pr")"
            PR_URL="$(jq -r '.url' <<<"$existing_pr")"
          else
            renewal_branch="$canonical_renewal_branch"
            PR_URL=''
          fi

          remote_branch_sha="$(git ls-remote "$remote_url" "refs/heads/${renewal_branch}" | awk '{print $1}')"
          if [[ -z "$remote_branch_sha" ]]; then
            git push "$remote_url" "HEAD:refs/heads/${renewal_branch}"
          else
            git push --force-with-lease="${renewal_branch}:${remote_branch_sha}" \
              "$remote_url" "HEAD:refs/heads/${renewal_branch}"
          fi

          if [[ -z "$PR_URL" ]]; then
            if [[ "${{ github.repository }}" == "red-hat-data-services/notebooks" ]]; then
              pr_title="GHA: ${BRANCH} - Update RHDS RPM lock files"
            else
              pr_title="GHA: (ODH+RHDS) Update RPM lock files"
            fi
            PR_URL="$(gh pr create \
              --title "$pr_title" \
              --head "$renewal_branch" \
              --body "Automated regeneration of \`odh/rpms.lock.yaml\` and \`rhds/rpms.lock.yaml\` from \`rpms.in.yaml\` for **${BRANCH}**. Tide will merge this PR automatically after all reported checks are green." \
              --label "automated-rpms-lockfile-update" \
              --base "$BRANCH")"
          fi
          echo "PR_URL=${PR_URL}" >> "$GITHUB_ENV"

      - name: Approve renewal PR
        if: env.PR_URL != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review "${PR_URL}" \
            --approve \
            --body "Auto-approved after RPM renewal workflow validation."

      - name: Add Tide merge labels
        if: env.PR_URL != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr_number="${PR_URL##*/}"
          gh api --method POST \
            "repos/${{ github.repository }}/issues/${pr_number}/labels" \
            -f 'labels[]=lgtm' \
            -f 'labels[]=approved' \
            --silent
