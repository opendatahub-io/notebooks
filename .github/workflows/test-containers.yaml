---
name: Test Infrastructure Self-Test

"on":
  workflow_dispatch:
  pull_request:
    paths: &test-containers-paths
      - 'tests/containers/**'
      - 'tests/conftest.py'
      - 'pytest.ini'
      - '.github/workflows/test-containers.yaml'
      - 'ci/find_images_for_test_matrix.py'
  push:
    branches: [main, stable, 'rhoai-*']
    paths: *test-containers-paths

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

env:
  TESTCONTAINERS_RYUK_DISABLED: "true"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository }}/workbench-images"

jobs:
  find-images:
    name: Find test images
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Find images for test matrix
        id: find
        env:
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.event.pull_request.base.ref || github.ref_name }}
        shell: python
        # language=python
        run: |
          import json, os, re, subprocess, sys
          sys.path.insert(0, "ci")

          from find_images_for_test_matrix import find_suitable_sha

          registry = os.environ["IMAGE_REGISTRY"]
          ref_prefix = re.sub(r"[^a-zA-Z0-9._-]", "_", os.environ["REF_NAME"])[:40]
          if os.environ.get("GITHUB_REPOSITORY") == "opendatahub-io/notebooks":
              tag_suffix = "_odh_linux_amd64"
          else:
              tag_suffix = "_rhoai_linux_amd64"
          required = [
              "codeserver-ubi9-python-3.12",
              "jupyter-minimal-ubi9-python-3.12",
              "jupyter-datascience-ubi9-python-3.12",
              "runtime-datascience-ubi9-python-3.12",
              "rstudio-rhel9-python-3.11",
          ]

          result = subprocess.run(
              ["skopeo", "list-tags", "--creds", f"token:{os.environ['GH_TOKEN']}", f"docker://{registry}"],
              capture_output=True, text=True, timeout=180,
          )
          if result.returncode != 0:
              print(f"::error::skopeo list-tags failed: {result.stderr}", file=sys.stderr)
              sys.exit(1)

          sha = find_suitable_sha(ref_prefix, tag_suffix, required, result.stdout)
          matrix = {"include": [
              {"name": img, "image": f"{registry}:{img}-{ref_prefix}_{sha}{tag_suffix}"} for img in required
          ]}
          print(f"Using ref {ref_prefix!r}, SHA {sha}")
          print(json.dumps(matrix, indent=2))

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(matrix)}\n")

  container-tests:
    name: "${{ matrix.name }}"
    needs: find-images
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.find-images.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version-file: pyproject.toml
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install deps
        run: uv sync --locked

      # Workaround: ubuntu-26.04 AppArmor stub profile for podman gives it a named label
      # ("podman") instead of "unconfined". The pasta profile only allows signals from
      # "unconfined" (via abstractions/base), so podman can't SIGTERM pasta on container
      # stop → "rootless netns: kill network process: permission denied".
      # Fix: allow pasta to receive signals from the podman profile.
      # https://bugs.debian.org/cgi-bin/bugreport.cgi?bug=1100135
      - name: Fix AppArmor pasta/podman signal conflict
        run: |
          set -Eeuxo pipefail
          if [[ -f /etc/apparmor.d/abstractions/pasta ]] && ! grep -q 'peer=podman' /etc/apparmor.d/abstractions/pasta; then
            echo '  signal (receive) peer=podman,' | sudo tee -a /etc/apparmor.d/abstractions/pasta
            sudo apparmor_parser -r /etc/apparmor.d/usr.bin.pasta
          fi

      - name: Start Podman socket
        run: |
          set -Eeuxo pipefail
          podman --version
          systemctl --user enable --now podman.socket
          echo "DOCKER_HOST=unix://$(podman info --format '{{.Host.RemoteSocket.Path}}')" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c  # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and run tests
        env:
          TEST_IMAGE: ${{ matrix.image }}
        run: |
          set -Eeuxo pipefail
          podman pull "${TEST_IMAGE}"
          uv run pytest tests/containers \
            -m 'not openshift and not cuda and not rocm' \
            --image="${TEST_IMAGE}" \
            -v

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3  # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml

  openshift-container-tests:
    name: "openshift: ${{ matrix.name }}"
    needs: find-images
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.find-images.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version-file: pyproject.toml
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install deps
        run: uv sync --locked

      # Rootful podman sharing image storage with cri-o, same as build-notebooks-TEMPLATE.yaml,
      # so the pod created by the openshift-marked tests can find the image without re-pulling.
      - name: Install and configure Podman
        uses: './.github/actions/install-podman-action'
        with:
          platform: linux/amd64

      - name: Provision K8s cluster
        uses: ./.github/actions/provision-k8s

      - name: Login to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c  # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and run OpenShift container tests
        env:
          TEST_IMAGE: ${{ matrix.image }}
          DOCKER_HOST: "unix:///var/run/podman/podman.sock"
          TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: "/var/run/podman/podman.sock"
        run: |
          set -Eeuxo pipefail
          podman pull "${TEST_IMAGE}"
          uv run pytest --capture=fd tests/containers \
            -m 'openshift and not cuda and not rocm' \
            --image="${TEST_IMAGE}" \
            --junitxml=junit-openshift.xml \
            -v

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3  # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit-openshift.xml
