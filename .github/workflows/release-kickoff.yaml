---
# Manual release kickoff: apply optional versions_config overrides, run make kickoff-release,
# validate with make test, and open a PR with the resulting changes.
name: Release Kickoff Action

permissions: {}

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to update"
        required: false
        default: "main"
      release_full_version:
        description: "Optional override for versions_config.yml release.full_version (e.g. 3.6.0)"
        required: false
        default: ""
      release_rhds_os_base:
        description: "Optional override for versions_config.yml release.rhds_os_base (e.g. el9.8)"
        required: false
        default: ""
      release_python_version:
        description: "Optional override for versions_config.yml release.python_version (e.g. 3.12)"
        required: false
        default: ""
      versions_overrides:
        description: |
          Optional overrides for any versions_config.yml fields as dot.path=value pairs, one per line.
          Example:
          artifacts.base_image.cuda.tensorflow.acc_version=13.0
          artifacts.base_image.cpu.rhds.channel=fast
          artifacts.base_image.rocm.pytorch.rhds.channel=stable
        required: false
        default: ""

jobs:
  kickoff-release:
    runs-on: ubuntu-26.04
    concurrency:
      group: kickoff-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      BRANCH: ${{ github.event.inputs.branch || 'main' }}
      TMPDIR: /var/tmp
      CI: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.BRANCH }}
          persist-credentials: false
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"

      - name: Create kickoff branch
        run: |
          BRANCH_NAME="release-kickoff-$(date +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH_NAME"
          echo "KICKOFF_BRANCH=$BRANCH_NAME" >> "${GITHUB_ENV}"

      - name: Setup uv and Python
        uses: ./.github/actions/setup-uv

      - name: Install skopeo and git-crypt
        uses: ./.github/actions/apt-install
        with:
          packages: skopeo git-crypt

      - name: Prepare Podman temp directory
        run: mkdir -p "$TMPDIR"

      # Registry auth must be configured before Install Podman. install-podman-action runs
      # `sudo podman system reset`, which can leave root-owned files under ~/.config/containers.
      - name: Unlock encrypted secrets with git-crypt
        run: |
          KEY_PATH="$(mktemp "${RUNNER_TEMP}/git-crypt-key.XXXXXX")"
          printf '%s' "${GIT_CRYPT_KEY}" | base64 --decode > "${KEY_PATH}"
          trap 'rm -f "${KEY_PATH}"' EXIT
          git-crypt unlock "${KEY_PATH}"
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}

      - name: Configure registry auth from pull-secret
        run: |
          mkdir -p "$HOME/.config/containers"
          cp ci/secrets/pull-secret.json "$HOME/.config/containers/auth.json"

      - name: Add scoped Quay credentials (if secrets are present)
        env:
          AIPCC_USER: ${{ secrets.AIPCC_QUAY_BOT_USERNAME }}
          AIPCC_PASS: ${{ secrets.AIPCC_QUAY_BOT_PASSWORD }}
          RHOAI_USER: ${{ secrets.RHOAI_QUAY_BOT_USERNAME }}
          RHOAI_PASS: ${{ secrets.RHOAI_QUAY_BOT_PASSWORD }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          from pathlib import Path

          auth_path = Path.home() / ".config/containers/auth.json"
          auth_doc = json.loads(auth_path.read_text(encoding="utf-8"))
          auths = auth_doc.setdefault("auths", {})

          def set_scoped_auth(scope: str, username: str, password: str) -> bool:
              if not username or not password:
                  return False
              token = base64.b64encode(f"{username}:{password}".encode("utf-8")).decode("ascii")
              auths[scope] = {"auth": token}
              return True

          has_aipcc = set_scoped_auth(
              "quay.io/aipcc",
              os.environ.get("AIPCC_USER", "").strip(),
              os.environ.get("AIPCC_PASS", "").strip(),
          )
          has_rhoai = set_scoped_auth(
              "quay.io/rhoai",
              os.environ.get("RHOAI_USER", "").strip(),
              os.environ.get("RHOAI_PASS", "").strip(),
          )

          auth_path.write_text(json.dumps(auth_doc, indent=2) + "\n", encoding="utf-8")

          if not has_aipcc:
              print("AIPCC_QUAY_BOT_USERNAME/AIPCC_QUAY_BOT_PASSWORD missing, skipped quay.io/aipcc scoped auth")
          if not has_rhoai:
              print("RHOAI_QUAY_BOT_USERNAME/RHOAI_QUAY_BOT_PASSWORD missing, skipped quay.io/rhoai scoped auth")
          PY

      - name: Apply versions_config release overrides (optional)
        env:
          RELEASE_FULL_VERSION: ${{ github.event.inputs.release_full_version }}
          RELEASE_RHDS_OS_BASE: ${{ github.event.inputs.release_rhds_os_base }}
          RELEASE_PYTHON_VERSION: ${{ github.event.inputs.release_python_version }}
          VERSIONS_OVERRIDES: ${{ github.event.inputs.versions_overrides }}
        run: |
          set -euo pipefail

          ./uv run python - <<'PY'
          from __future__ import annotations

          import os
          import re
          from collections.abc import Mapping, Sequence
          from io import StringIO
          from pathlib import Path
          from typing import Any

          from ruamel.yaml import YAML
          from ruamel.yaml.scalarstring import DoubleQuotedScalarString, SingleQuotedScalarString

          _DOCUMENT_START_RE = re.compile(r"(?s)(.*?^---\n)(.*)", re.MULTILINE)

          def parse_scalar_value(raw: str) -> Any:
              lowered = raw.lower()
              if lowered == "true":
                  return True
              if lowered == "false":
                  return False
              if raw.isdigit() or (raw.startswith("-") and raw[1:].isdigit()):
                  return int(raw)
              return raw

          def preserve_scalar_style(old_value: Any, new_value: Any) -> Any:
              if isinstance(old_value, DoubleQuotedScalarString):
                  return DoubleQuotedScalarString(str(new_value))
              if isinstance(old_value, SingleQuotedScalarString):
                  return SingleQuotedScalarString(str(new_value))
              return new_value

          def build_yaml() -> YAML:
              yml = YAML()
              yml.preserve_quotes = True
              yml.width = 1024 * 1024
              yml.indent(mapping=2, sequence=4, offset=2)
              return yml

          def split_document(content: str) -> tuple[str, str]:
              match = _DOCUMENT_START_RE.match(content)
              if match is None:
                  raise ValueError("Expected --- document start in versions_config.yml")
              return match.group(1), match.group(2)

          def set_nested_scalar(doc: dict[str, Any], dotted_key: str, raw_value: str) -> None:
              node: Any = doc
              parts = dotted_key.split(".")
              for part in parts[:-1]:
                  if part not in node or not isinstance(node[part], Mapping):
                      raise KeyError(
                          f"Path '{dotted_key}' is invalid at '{part}'. Only existing keys are allowed."
                      )
                  node = node[part]
              leaf = parts[-1]
              if leaf not in node:
                  raise KeyError(f"Path '{dotted_key}' does not exist in versions_config.yml.")
              old_value = node[leaf]
              if isinstance(old_value, Mapping) or (
                  isinstance(old_value, Sequence) and not isinstance(old_value, str)
              ):
                  raise ValueError(f"Path '{dotted_key}' must target a scalar value.")
              node[leaf] = preserve_scalar_style(old_value, parse_scalar_value(raw_value))

          def apply_overrides(content: str, overrides: dict[str, str]) -> str:
              if not overrides:
                  return content

              header, body = split_document(content)
              yml = build_yaml()
              doc = yml.load(body)
              if not isinstance(doc, dict):
                  raise ValueError("versions_config.yml body must be a mapping.")

              for dotted_key, raw_value in overrides.items():
                  set_nested_scalar(doc, dotted_key, raw_value)

              buf = StringIO()
              yml.dump(doc, buf)
              return header + buf.getvalue()

          def parse_override_lines(raw_pairs: str) -> dict[str, str]:
              overrides: dict[str, str] = {}
              for raw_line in raw_pairs.splitlines():
                  line = raw_line.strip()
                  if not line or line.startswith("#"):
                      continue
                  if "=" not in line:
                      raise ValueError(f"Invalid override line {line!r}. Expected dot.path=value.")
                  key, value = line.split("=", 1)
                  key = key.strip()
                  if not key:
                      raise ValueError(f"Invalid override line {line!r}: empty key.")
                  overrides[key] = value.strip()
              return overrides

          direct_overrides = {
              "release.full_version": os.environ.get("RELEASE_FULL_VERSION", "").strip(),
              "release.rhds_os_base": os.environ.get("RELEASE_RHDS_OS_BASE", "").strip(),
              "release.python_version": os.environ.get("RELEASE_PYTHON_VERSION", "").strip(),
          }
          effective = {k: v for k, v in direct_overrides.items() if v}
          effective.update(parse_override_lines(os.environ.get("VERSIONS_OVERRIDES", "")))
          if not effective:
              raise SystemExit(0)

          cfg_path = Path("versions_config.yml")
          original = cfg_path.read_text(encoding="utf-8")
          updated = apply_overrides(original, effective)
          if updated != original:
              cfg_path.write_text(updated, encoding="utf-8")
          PY

          if git diff --quiet -- versions_config.yml; then
            echo "No versions_config.yml release overrides provided."
          else
            echo "Applied versions_config.yml release overrides:"
            git diff -- versions_config.yml
          fi

      - name: Install Podman
        uses: ./.github/actions/install-podman-action
        with:
          platform: linux/amd64

      - name: Mask subscription credentials
        env:
          SUBSCRIPTION_ACTIVATION_KEY: ${{ secrets.SUBSCRIPTION_ACTIVATION_KEY }}
          SUBSCRIPTION_ORG: ${{ secrets.SUBSCRIPTION_ORG }}
        run: |
          if [[ -z "$SUBSCRIPTION_ACTIVATION_KEY" || -z "$SUBSCRIPTION_ORG" ]]; then
            echo "SUBSCRIPTION_ACTIVATION_KEY and SUBSCRIPTION_ORG repository secrets are required." >&2
            exit 1
          fi
          echo "::add-mask::${SUBSCRIPTION_ACTIVATION_KEY}"
          echo "::add-mask::${SUBSCRIPTION_ORG}"

      - name: Run release kickoff recipe
        env:
          SUBSCRIPTION_ACTIVATION_KEY: ${{ secrets.SUBSCRIPTION_ACTIVATION_KEY }}
          SUBSCRIPTION_ORG: ${{ secrets.SUBSCRIPTION_ORG }}
        run: |
          set -euo pipefail
          make kickoff-release

      - name: Create Pull Request with updates
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
          RELEASE_FULL_VERSION_INPUT: ${{ github.event.inputs.release_full_version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          git add -A .
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          if [[ -n "${RELEASE_FULL_VERSION_INPUT}" ]]; then
            RELEASE_FULL_VERSION="${RELEASE_FULL_VERSION_INPUT}"
          else
            RELEASE_FULL_VERSION="$(./uv run python -c "import yaml; print(yaml.safe_load(open('versions_config.yml', encoding='utf-8'))['release']['full_version'])")"
          fi

          git commit -m "Kick off release updates for ${RELEASE_FULL_VERSION}"
          git push -u "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "${KICKOFF_BRANCH}"

          gh label create "automated-release-kickoff" \
            --description "Auto-created PR by release kickoff workflow" \
            --color "0E8A16" \
            2>/dev/null || true

          gh pr create \
            --title "[Major Release: ${RELEASE_FULL_VERSION}]: Automated PR for new major release updates" \
            --head "${KICKOFF_BRANCH}" \
            --body "$(cat <<EOF
          Automated release kickoff run for release **${RELEASE_FULL_VERSION}** using:

          - optional \`versions_config.yml\` overrides from workflow inputs
          - \`make kickoff-release\` (build-args sync, lock refresh, ODH/RHDS RPM locks, rollout)
          - \`make test\` validation gate inside kickoff-release
          EOF
          )" \
            --label "automated-release-kickoff" \
            --base "${BRANCH}"
