---
name: Update commit-latest.env on params-latest.env change

"on":
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'  # Daily at 11:00 UTC

jobs:
  sync-commit-latest:
    runs-on: ubuntu-26.04
    concurrency:
      group: update-commit-latest-env-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Install skopeo
        uses: ./.github/actions/apt-install
        with:
          packages: skopeo
          update: 'false'

      - name: Setup uv and Python
        uses: ./.github/actions/setup-uv

      - name: Configure Quay.io pull auth for RHOAI namespace
        if: env.RHOAI_QUAY_BOT_USERNAME != ''
        run: |
          printf '%s' "${RHOAI_QUAY_BOT_PASSWORD}" | skopeo login --username "${RHOAI_QUAY_BOT_USERNAME}" --password-stdin quay.io
        env:
          RHOAI_QUAY_BOT_USERNAME: ${{ secrets.RHOAI_QUAY_BOT_USERNAME }}
          RHOAI_QUAY_BOT_PASSWORD: ${{ secrets.RHOAI_QUAY_BOT_PASSWORD }}

      - name: Update commit-latest.env manifests
        run: uv run scripts/update-commit-latest-env.py --variant both

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add \
            manifests/odh/base/commit-latest.env \
            manifests/rhoai/base/commit-latest.env

          if git diff --cached --quiet; then
            echo "No effective changes in commit-latest.env files, skipping commit."
          else
            git commit -m "ci: update commit SHAs in commit-latest.env"
            git push
          fi
