---
name: Update commit-latest.env on params-latest.env change

"on":
  workflow_dispatch:
    inputs:
      target_branch:
        description: |
          Branch to refresh commit-latest.env on.
          RHDS (red-hat-data-services/notebooks): specify a rhoai-X.Y release branch (e.g. rhoai-2.25).
          ODH (opendatahub-io/notebooks): use main only.
        required: true
        default: main
        type: string
  schedule:
    - cron: '0 11 * * *'  # Daily at 11:00 UTC

env:
  BASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || 'main' }}

jobs:
  sync-commit-latest:
    env:
      RHOAI_QUAY_BOT_USERNAME: ${{ secrets.RHOAI_QUAY_BOT_USERNAME }}
      RHOAI_QUAY_BOT_PASSWORD: ${{ secrets.RHOAI_QUAY_BOT_PASSWORD }}
    if: |
      !(github.repository == 'red-hat-data-services/notebooks' && (github.event_name == 'workflow_dispatch' && inputs.target_branch || 'main') == 'main') &&
      !(github.repository == 'opendatahub-io/notebooks' && github.event_name == 'workflow_dispatch' && inputs.target_branch != 'main') &&
      (github.event_name != 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.target_branch || 'main') == 'main')
    runs-on: ubuntu-26.04
    concurrency:
      group: update-commit-latest-env-${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || 'main' }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.BASE_BRANCH }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Select update mode for branch
        id: mode
        run: |
          set -euo pipefail
          update_branch="ci/update-commit-latest-env-${BASE_BRANCH//\//-}"

          if [[ "${GITHUB_REPOSITORY}" == "opendatahub-io/notebooks" && "${BASE_BRANCH}" != "main" ]]; then
            echo "ODH repositories support main only for this workflow."
            echo "Leave target_branch as main when running manually on opendatahub-io/notebooks."
            exit 1
          fi

          if [[ "${BASE_BRANCH}" == "main" ]]; then
            echo "variant=both" >> "${GITHUB_OUTPUT}"
            echo "rhoai_tag=" >> "${GITHUB_OUTPUT}"
            echo "target_scope=ODH+RHOAI" >> "${GITHUB_OUTPUT}"
          elif [[ "${BASE_BRANCH}" =~ ^rhoai-[0-9]+\.[0-9]+$ ]]; then
            echo "variant=rhoai" >> "${GITHUB_OUTPUT}"
            echo "rhoai_tag=${BASE_BRANCH}" >> "${GITHUB_OUTPUT}"
            echo "target_scope=RHOAI only" >> "${GITHUB_OUTPUT}"
          else
            echo "Unsupported branch for this workflow: ${BASE_BRANCH}"
            echo "Allowed branches: main (ODH) or rhoai-X.Y (RHDS on-demand)"
            exit 1
          fi

          echo "update_branch=${update_branch}" >> "${GITHUB_OUTPUT}"

      - name: Install skopeo
        uses: ./.github/actions/apt-install
        with:
          packages: skopeo
          update: 'false'

      - name: Setup uv and Python
        uses: ./.github/actions/setup-uv

      - name: Configure Quay.io pull auth for RHOAI namespace
        if: env.RHOAI_QUAY_BOT_USERNAME != ''
        run: |
          printf '%s' "${RHOAI_QUAY_BOT_PASSWORD}" | skopeo login --username "${RHOAI_QUAY_BOT_USERNAME}" --password-stdin quay.io

      - name: Use main branch updater script for RHDS on-demand runs
        if: github.repository == 'red-hat-data-services/notebooks' && github.event_name == 'workflow_dispatch' && inputs.target_branch != 'main'
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git show origin/main:scripts/update-commit-latest-env.py > scripts/update-commit-latest-env.py

      - name: Update commit-latest.env manifests
        run: |
          set -euo pipefail
          cmd=(uv run scripts/update-commit-latest-env.py --variant "${{ steps.mode.outputs.variant }}")
          if [[ -n "${{ steps.mode.outputs.rhoai_tag }}" ]]; then
            cmd+=(--rhoai-version-tag "${{ steps.mode.outputs.rhoai_tag }}")
          fi

          echo "Running update scope: ${{ steps.mode.outputs.target_scope }}"
          "${cmd[@]}"

      - name: Commit, push branch, and open or refresh pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add manifests/rhoai/base/commit-latest.env
          if [[ "${{ steps.mode.outputs.variant }}" == "both" ]]; then
            git add manifests/odh/base/commit-latest.env
          fi

          if git diff --cached --quiet; then
            echo "No effective changes in commit-latest.env files, skipping PR update."
            exit 0
          fi

          git checkout -B "${{ steps.mode.outputs.update_branch }}"
          git commit -m "ci: update commit SHAs in commit-latest.env"
          git push --force-with-lease -u origin "${{ steps.mode.outputs.update_branch }}"

          existing_pr="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${{ steps.mode.outputs.update_branch }}" \
            --base "${BASE_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "${existing_pr}" ]]; then
            echo "Updated branch for existing PR #${existing_pr}."
            exit 0
          fi

          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "ci: update commit SHAs in commit-latest.env" \
            --head "${{ steps.mode.outputs.update_branch }}" \
            --base "${BASE_BRANCH}" \
            --body "Automated refresh of ${{ steps.mode.outputs.target_scope }} commit-latest.env from Quay image vcs-ref labels. Created by .github/workflows/update-commit-latest-env.yaml."
