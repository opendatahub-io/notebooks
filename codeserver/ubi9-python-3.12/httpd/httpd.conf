# Basic httpd configuration for CGI processing
ServerRoot "/etc/httpd"
Listen 8080

# Load modules
LoadModule mpm_prefork_module modules/mod_mpm_prefork.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule cgi_module modules/mod_cgi.so
LoadModule rewrite_module modules/mod_rewrite.so

# User and Group - run as the container user (OpenShift assigns random UIDs)
# User 1001
# Group 0

# Server configuration
ServerAdmin root@localhost
ServerName localhost
PidFile /var/run/httpd/httpd.pid

# Document root
DocumentRoot "/opt/app-root"

# Directory configuration
<Directory />
    AllowOverride none
    Require all denied
</Directory>

<Directory "/opt/app-root">
    AllowOverride None
    Require all granted
</Directory>

# Culling probe only: SetHandler is core (no mod_mime). AddHandler would require mod_mime.
<Directory "/opt/app-root/api/kernels">
    AllowOverride None
    Options +ExecCGI
    Require all granted
    DirectoryIndex access.cgi
</Directory>

<LocationMatch "^/api/kernels/">
    SetHandler cgi-script
    Options +ExecCGI
    Require all granted
</LocationMatch>

# Error and access logs
ErrorLog "/dev/stderr"
LogLevel warn

# Include additional configurations
# IncludeOptional conf.d/*.conf
