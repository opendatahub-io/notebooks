# Hermetic universal workbench + Elyra pipeline runtime (dual-mode entrypoint).
# RH-index locks for both ODH and RHOAI (requirements.cpu.txt / uv.lock.d/pylock.cpu.toml).
# Bases differ: ODH → CentOS Stream odh-base-image; RHOAI → AIPCC cpu-el9.
# Lean JupyterLab + Elyra/Kale; no datascience/AI framework stacks.

[project]
name = "jupyter-universal-notebook"
version = "0.1.0"
requires-python = "==3.12.*"

dependencies = [
    # Hermetic cpu-base: prefetched with the rest of the stack (see repo-root prefetch-input/ and jupyter/minimal pyproject)
    "uv",
    "micropipenv[toml]",

    # Base packages
    "wheel",
    "setuptools",

    # Jupyterlab and datascience extensions
    "odh-notebooks-meta-jupyterlab-deps",
    "odh-notebooks-meta-jupyterlab-datascience-deps",

    # PDF export (nbconvert); RHAIENG-5765 / AIPCC-7795
    "pandoc-rhai",
]

[tool.uv]
# FIPS: exclude statically linked py-spy profiler (RHAIENG-58916)
exclude-dependencies = ["py-spy"]

# Four arch-specific environments so uv export emits ``== x86_64 or == aarch64``
# allowlist markers on gated deps instead of ``!= ppc64le`` denylist markers.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'ppc64le'",
    "sys_platform == 'linux' and platform_machine == 's390x'",
]

environments = [
    "sys_platform == 'linux' and implementation_name == 'cpython' and python_full_version == '3.12.*'",
]

override-dependencies = [
    # odh-elyra pins jupyter-resource-usage<1.2.dev0, but 1.1.1 needs psutil<6 while
    # ipython 9.14+ on the RH index needs psutil>=7. Index ships 1.2.1.
    "jupyter-resource-usage>=1.2.1,<1.3",
    # RHAIENG-2458: urllib3>=2.7.0 — CVE-2026-44431, CVE-2026-44432 (2.7.0); CVE-2025-66418 (2.6.0)
    # Override needed because odh-elyra pulls in appengine-python-standard with urllib3<2
    "urllib3>=2.7.0",
    # AIPCC-13675: UPB segfault on s390x affects protobuf 6.33.5-6.33.6; fixed in 7.x.
    # kfp 2.17.0's protobuf<7.0 is a conservative pin (gencode 6.31.1; APIs exist in 7.x).
    # 7.x series only.
    "protobuf>=7.36.1,<8",
]

[tool.uv.sources]
odh-notebooks-meta-jupyterlab-deps = { path = "../../../dependencies/odh-notebooks-meta-jupyterlab-deps" }
odh-notebooks-meta-jupyterlab-datascience-deps = { path = "../../../dependencies/odh-notebooks-meta-jupyterlab-datascience-deps" }
