---
# artifacts.in.yaml - Generic (non-RPM, non-pip) artifacts to prefetch
#
# Shared RHDS generic inputs for repo-root prefetch-input/ consumers (e.g.
# jupyter-baseline). Component-local trees (codeserver-baseline) may carry
# their own copy; keep this aligned when adding URLs here.

input:
    - url: https://www.centos.org/keys/RPM-GPG-KEY-CentOS-Official
    - url: https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-9
    # TeX Live installer and pandoc binaries for jupyter/baseline PDF export.
    # PDF export is skipped on ppc64le/s390x.
    - url: https://mirror.ctan.org/systems/texlive/tlnet/install-tl-unx.tar.gz
    - url: https://github.com/jgm/pandoc/releases/download/3.7.0.2/pandoc-3.7.0.2-linux-amd64.tar.gz
    - url: https://github.com/jgm/pandoc/releases/download/3.7.0.2/pandoc-3.7.0.2-linux-arm64.tar.gz
