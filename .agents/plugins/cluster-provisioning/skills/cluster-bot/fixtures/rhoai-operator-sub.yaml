# Default: install latest 3.4.z on channel stable-3.x (channel head / currentCSV).
#
# Do NOT set startingCSV below channel head — OLM installs that CSV then immediately
# plans an upgrade to the head (e.g. 3.4.0 → 3.4.2), wasting time and polluting
# install benchmarks. For a fixed older CSV, use rhoai-operator-sub-pinned.yaml.
---
apiVersion: v1
kind: Namespace
metadata:
  name: redhat-ods-operator
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhods-operator
  namespace: redhat-ods-operator
spec:
  channel: stable-3.x
  installPlanApproval: Automatic
  name: rhods-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
