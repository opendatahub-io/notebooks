# opendatahub-io/notebooks project-specific additions to the pinned upstream
# check-payload config. Compose the effective config with:
#
#   make check-payload-config > /path/to/config.toml
#
# The [[payload.NAME.ignore]] blocks upstream only match `check-payload scan
# payload` (component-name matching). Our own CI always runs `check-payload
# scan local --path`, where the payload name is always empty, so `payload.*`
# entries never match for us — the rpm/global waivers below are what actually
# apply to those scans.

# AI Pipelines override (RHOAIENG-24702 and RHOAIENG-38121)
# When FIPS is enabled, /usr/bin/argoexec-fips is used. /usr/bin/argoexec is
# only used for portability reasons in non-FIPS environments.
[[payload.odh-data-science-pipelines-argo-argoexec-container.ignore]]
error = "ErrGoNotCgoEnabled"
files = ["/usr/bin/argoexec"]

[[payload.odh-data-science-pipelines-argo-argoexec-container.ignore]]
error = "ErrGoMissingSymbols"
files = ["/usr/bin/argoexec"]

[[payload.odh-data-science-pipelines-argo-argoexec-container.ignore]]
error = "ErrNotDynLinked"
files = ["/usr/bin/argoexec"]

# AI Pipelines override (RHOAIENG-24702 and RHOAIENG-38121)
# When FIPS is enabled, /usr/bin/launcher-v2-fips is used. /usr/bin/launcher-v2 is
# only used for portability reasons in non-FIPS environments.
[[payload.odh-ml-pipelines-launcher-container.ignore]]
error = "ErrGoNotCgoEnabled"
files = ["/usr/bin/launcher-v2"]

[[payload.odh-ml-pipelines-launcher-container.ignore]]
error = "ErrGoMissingSymbols"
files = ["/usr/bin/launcher-v2"]

[[payload.odh-ml-pipelines-launcher-container.ignore]]
error = "ErrNotDynLinked"
files = ["/usr/bin/launcher-v2"]

# py-spy is excluded from images via exclude-dependencies (RHAIENG-58916), so
# it never appears in a local scan; no waiver needed here.
# AIPCC workbenches use dynamically linked pandoc-rhai 3.9.0.2 (RHAIENG-5765).
# Public-index jupyter-baseline installs pandoc from prefetched GitHub tarballs
# (artifacts.in.yaml) on x86_64/aarch64.

# odh-workbench-jupyter-baseline-cpu-py312-c9s
[[payload.odh-workbench-jupyter-baseline-cpu-py312-c9s.ignore]]
# Pandoc: bundled for notebook PDF/LaTeX export; not a crypto boundary. Track: RHOAIENG-58626.
error = "ErrNotDynLinked"
files = ["/usr/local/pandoc/bin/pandoc"]

# odh-workbench-jupyter-baseline-cpu-py312-rhel9
[[payload.odh-workbench-jupyter-baseline-cpu-py312-rhel9.ignore]]
# Pandoc: bundled for notebook PDF/LaTeX export; not a crypto boundary. Track: RHOAIENG-58626.
error = "ErrNotDynLinked"
files = ["/usr/local/pandoc/bin/pandoc"]

# when scanning with `scan local --path`
[[ignore]]
error = "ErrNotDynLinked"
files = [
    # Legacy path (pre-1.122 @vscode/ripgrep). Prefer AIPCC replacement via
    # replace-aipcc-ripgrep.sh; keep waiver for residual static bins if any.
    "/usr/lib/code-server/lib/vscode/node_modules/@vscode/ripgrep/bin/rg",
    # che-code wrapper: pre-built ripgrep from Dev Spaces che-code image (RHOAIENG-58626)
    "/opt/app-root/checode/node_modules/@vscode/ripgrep/bin/rg",
    # Che Code bundles additional static helper binaries; they do not perform
    # cryptographic operations and are covered by the workbench FIPS exclusion.
    "/opt/app-root/checode/node_modules/@github/copilot-linux-x64/ripgrep/bin/linux-x64/rg",
    "/opt/app-root/checode/node_modules/@github/copilot-linux-x64/tgrep/bin/linux-x64/tgrep",
    "/opt/app-root/checode/node_modules/@vscode/ripgrep-universal/bin/linux-x64/rg",
    "/opt/app-root/checode/node_modules/@vscode/sandbox-runtime/vendor/seccomp/x64/apply-seccomp",
    # Che Code bundles static Copilot search helpers. They are third-party
    # tooling and are not used as crypto or system executables.
    "/opt/app-root/checode/extensions/copilot/node_modules/@anthropic-ai/claude-agent-sdk/vendor/ripgrep/arm64-linux/rg",
    "/opt/app-root/checode/extensions/copilot/node_modules/@anthropic-ai/claude-agent-sdk/vendor/ripgrep/x64-linux/rg",
    "/opt/app-root/checode/extensions/copilot/node_modules/@github/copilot/sdk/ripgrep/bin/linux-x64/rg",
    "/opt/app-root/checode/extensions/copilot/node_modules/@github/copilot/sdk/tgrep/bin/linux-x64/tgrep",
    "/opt/app-root/checode/extensions/copilot/node_modules/@github/copilot/tgrep/bin/linux-x64/tgrep",
]
dirs = [
    # VS Code 1.122+ @vscode/sandbox-runtime seccomp BPF loaders (no crypto)
    "/usr/lib/code-server/lib/vscode/node_modules/@vscode/sandbox-runtime/dist/vendor/seccomp",
    "/usr/lib/code-server/lib/vscode/node_modules/@vscode/sandbox-runtime/vendor/seccomp",
    # Older package name kept for images built before the rename
    "/usr/lib/code-server/lib/vscode/node_modules/@anthropic-ai/sandbox-runtime/dist/vendor/seccomp",
    "/usr/lib/code-server/lib/vscode/node_modules/@anthropic-ai/sandbox-runtime/vendor/seccomp",
]

[[rpm.code-server.ignore]]
error = "ErrNotDynLinked"
files = [
    "/usr/lib/code-server/lib/vscode/node_modules/@vscode/ripgrep/bin/rg",
]
dirs = [
    "/usr/lib/code-server/lib/vscode/node_modules/@vscode/sandbox-runtime/dist/vendor/seccomp",
    "/usr/lib/code-server/lib/vscode/node_modules/@vscode/sandbox-runtime/vendor/seccomp",
    "/usr/lib/code-server/lib/vscode/node_modules/@anthropic-ai/sandbox-runtime/dist/vendor/seccomp",
    "/usr/lib/code-server/lib/vscode/node_modules/@anthropic-ai/sandbox-runtime/vendor/seccomp",
]

# `scan local --path` (used by our own CI) always uses an empty tag name.
# Our images are also built on CentOS Stream (ODH midstream), which is
# never going to be a certified RHEL distribution. Waive OS certification
# for local scans only.
[[tag."".ignore]]
error = "ErrOSNotCertified"
tags = [""]
